pack: dev-ml
rules:

  - id: ml-apple-python-cache
    name: Apple/system Python framework caches (user)
    category: ml-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.apple.python
    delete_mode: contents
    max_depth: 6

  - id: ml-chroma-vector-cache
    name: ChromaDB and local vector store caches
    category: ml-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/.cache/chroma
      - $HOME/.chroma
      - $HOME/Library/Caches/chroma
      - $XDG_CACHE_HOME/chroma
    delete_mode: contents
    max_depth: 6

  - id: ml-clip-openclip
