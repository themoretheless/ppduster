pack: apps-office-electron
rules:

  - id: macos-archive-utility-and-unarchivers
    name: Archive Utility, The Unarchiver, Keka, BetterZip temps/caches
    description: Built-in Archive Utility and third-party unarchiver caches/temps.
    category: temp
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 2
    paths:
      - $HOME/Library/Caches/com.apple.archiveutility
      - $HOME/Library/Group Containers/group.com.apple.ArchiveUtility.PKSignedContainer
      - $HOME/Library/Caches/cx.c3.theunarchiver
      - $HOME/Library/Caches/com.macpaw.site.theunarchiver
      - $HOME/Library/Caches/com.aone.keka
      - $HOME/Library/Caches/com.aone.keka.helper
      - $HOME/Library/Caches/com.aone.keka.xpc
      - $HOME/Library/Caches/com.macitbetter.betterzip
      - $HOME/Library/Caches/com.macitbetter.betterzip.Finder-Extension
      - $HOME/Library/Logs/Keka
      - $HOME/Library/Logs/The Unarchiver
    include_globs:
      - "com.apple.archiveutility/**"
      - "Keka*/**"
      - "The Unarchiver*/**"
      - "BetterZip*/**"
      - "Unarchiver*/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-chrome-disk-and-apps-cache
    name: Google Chrome disk cache and Chrome Apps media cache
    description: Chrome browser disk/GPU/shader caches and platform-app related cache trees; not profile cookies/logins.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.google.Chrome
      - $HOME/Library/Caches/com.google.Chrome.helper
      - $HOME/Library/Application Support/Google/Chrome/ShaderCache
      - $HOME/Library/Application Support/Google/Chrome/GrShaderCache
      - $HOME/Library/Application Support/Google/Chrome/GraphiteDawnCache
      - $HOME/Library/Application Support/Google/Chrome/Default/GPUCache
      - $HOME/Library/Application Support/Google/Chrome/Default/Code Cache
      - $HOME/Library/Application Support/Google/Chrome/Default/Service Worker/CacheStorage
      - $HOME/Library/Application Support/Google/Chrome/Default/Service Worker/ScriptCache
      - $HOME/Library/Application Support/Google/Chrome/Chrome Apps.localized
      - $HOME/Applications/Chrome Apps.localized
    delete_mode: contents
    max_depth: 6

  - id: macos-colorsync-user-caches
    name: ColorSync user caches
    description: ColorSync display/profile caches under user Caches (not custom ICC profile libraries).
    category: caches
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.apple.ColorSync
      - $HOME/Library/Caches/com.apple.colorsync.displayservices
      - $HOME/Library/Caches/com.apple.ColorSyncUtils
    delete_mode: contents
    max_depth: 4

  - id: macos-crash-and-diagnostic-reports
    name: CrashReporter and DiagnosticReports (user)
    description: User crash and diagnostic .ips/.crash reports under ~/Library/Logs and Application Support.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Logs/DiagnosticReports/Retired
      - $HOME/Library/Application Support/CrashReporter
      - $HOME/Library/Application Support/DiagnosticReports
    delete_mode: contents
    max_depth: 4

  - id: macos-cups-print-leftovers
    name: CUPS / print job leftovers (user)
    description: User Printers tree and print-proxy caches; not system /var/spool/cups.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Printers
      - $HOME/Library/Caches/com.apple.print.PrinterProxy
      - $HOME/Library/Caches/com.apple.printingmanager
      - $HOME/Library/Caches/com.apple.printcenter
      - $HOME/Library/Caches/com.apple.ipp.ipp-util
    delete_mode: contents
    max_depth: 5

  - id: macos-cursor-caches
    name: Cursor editor caches (not settings)
    description: Cursor Electron caches parallel to VS Code; never User/ or ~/.cursor settings.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Cursor/Cache
      - $HOME/Library/Application Support/Cursor/CachedData
      - $HOME/Library/Application Support/Cursor/Code Cache
      - $HOME/Library/Application Support/Cursor/GPUCache
      - $HOME/Library/Application Support/Cursor/DawnGraphiteCache
      - $HOME/Library/Application Support/Cursor/DawnWebGPUCache
      - $HOME/Library/Application Support/Cursor/CachedExtensionVSIXs
      - $HOME/Library/Application Support/Cursor/logs
      - $HOME/Library/Application Support/Cursor/Crashpad
      - $HOME/Library/Caches/com.todesktop.230313mzl4w4u92
      - $HOME/Library/Caches/com.todesktop.230313mzl4w4u92.ShipIt
    delete_mode: contents
    max_depth: 5

  - id: macos-db-clients-caches
    name: DB client caches (Compass, RedisInsight, TablePlus, Sequel Ace, Beekeeper)
    description: Desktop DB tool Electron/NSURL caches and logs; not connection credentials stores.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/MongoDB Compass/Cache
      - $HOME/Library/Application Support/MongoDB Compass/Code Cache
      - $HOME/Library/Application Support/MongoDB Compass/GPUCache
      - $HOME/Library/Application Support/MongoDB Compass/logs
      - $HOME/Library/Caches/com.mongodb.compass
      - $HOME/Library/Application Support/RedisInsight/Cache
      - $HOME/Library/Application Support/RedisInsight/Code Cache
      - $HOME/Library/Application Support/RedisInsight/GPUCache
      - $HOME/Library/Application Support/RedisInsight/logs
      - $HOME/Library/Caches/org.redisdesktop.rds
      - $HOME/Library/Caches/com.tinyapp.TablePlus
      - $HOME/Library/Application Support/com.tinyapp.TablePlus/Cache
      - $HOME/Library/Logs/TablePlus
      - $HOME/Library/Caches/com.sequel-ace.sequel-ace
      - $HOME/Library/Logs/Sequel Ace
      - $HOME/Library/Application Support/beekeeper-studio/Cache
      - $HOME/Library/Application Support/beekeeper-studio/Code Cache
      - $HOME/Library/Application Support/beekeeper-studio/GPUCache
      - $HOME/Library/Application Support/beekeeper-studio/logs
      - $HOME/Library/Caches/io.beekeeperstudio.desktop
      - $HOME/Library/Caches/io.beekeeperstudio.desktop.ShipIt
    delete_mode: contents
    max_depth: 4

  - id: macos-dmg-mount-residuals
    name: Disk image agent caches and TMP dmg residuals
    description: DiskImages agent caches and temporary dmg extract residuals under user TMPDIR.
    category: temp
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 2
    paths:
      - $HOME/Library/Caches/com.apple.DiskImages.DiskImageAgent
      - $HOME/Library/Logs/DiskImages
    include_globs:
      - "dmg.*"
      - "dmg.*/**"
      - "*.dmg.**"
      - "com.apple.DiskImages*/**"
      - "TemporaryItems/**/*.dmg"
    delete_mode: contents
    max_depth: 4

  - id: macos-docker-desktop-caches-logs
    name: Docker Desktop Electron caches and host logs
    description: Docker Desktop UI Electron caches and host/vm log trees. Not VM disk images.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Docker Desktop/Cache
      - $HOME/Library/Application Support/Docker Desktop/Code Cache
      - $HOME/Library/Application Support/Docker Desktop/GPUCache
      - $HOME/Library/Application Support/Docker Desktop/logs
      - $HOME/Library/Application Support/Docker Desktop/blob_storage
      - $HOME/Library/Containers/com.docker.docker/Data/log
      - $HOME/Library/Containers/com.docker.docker/Data/log/host
      - $HOME/Library/Containers/com.docker.docker/Data/log/vm
      - $HOME/Library/Caches/com.docker.docker
      - $HOME/Library/Caches/com.electron.dockerdesktop
      - $HOME/Library/Caches/com.electron.dockerdesktop.ShipIt
      - $HOME/Library/Logs/Docker Desktop
      - $HOME/Library/Logs/DockerDesktop
