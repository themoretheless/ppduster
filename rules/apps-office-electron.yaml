  - id: macos-installer-pkg-dmg-caches
    name: "Installer leftovers: Caches .pkg/.dmg and Homebrew Cask downloads"
    description: Downloaded installer media left in user Caches and Homebrew download cache.
    category: package-cache
    platform: macos
    risk: report-only
