    max_depth: 6

  - id: macos-docker-desktop-disk-report
    name: Docker Desktop VM disk images (report-only)
    description: Docker.raw / Docker.qcow2 host disk images. Inventory only.
    category: report-only
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw
      - $HOME/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.qcow2
      - $HOME/Library/Containers/com.docker.docker/Data/com.docker.driver.amd64-linux/Docker.raw
      - $HOME/Library/Containers/com.docker.docker/Data/com.docker.driver.amd64-linux/Docker.qcow2
    delete_mode: path
    max_depth: 1

  - id: macos-electron-generic-shipit-caches
    name: Generic Electron/Squirrel ShipIt update caches
    description: "Common *.ShipIt and known Electron updater cache roots under ~/Library/Caches."
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.electron.dockerdesktop.ShipIt
      - $HOME/Library/Caches/electron
      - $HOME/Library/Caches/SquirrelTemp
    include_globs:
      - "*.ShipIt/**"
      - "**/ShipIt/**"
    delete_mode: contents
    max_depth: 4

  - id: macos-figma-electron-cache
    name: Figma desktop Electron caches
