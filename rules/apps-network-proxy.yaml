    max_depth: 4

  - id: net-lulu-config-report
    name: LuLu rules and preferences residual (report-only)
    description: LuLu preference/rules residual inventory only.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/LuLu
      - $HOME/Library/Application Support/com.objective-see.lulu
    delete_mode: contents
    max_depth: 6

  - id: net-mitmproxy-certs-report
    name: mitmproxy CA and config inventory (report-only)
    description: Report size of mitmproxy home including certs; never auto-delete.
    category: system-data
    platform: any
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.mitmproxy
    delete_mode: contents
    max_depth: 6

  - id: net-mitmproxy-flows-temp
    name: mitmproxy flow dumps and temp (careful)
    description: Aged flow files and temp under ~/.mitmproxy excluding CA keys.
    category: app-cache
    platform: any
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/.mitmproxy
    include_globs:
      - "**/*.flow"
      - "**/*.flows"
      - "**/flows"
      - "**/*dump*"
      - "**/*.log"
      - "**/tmp/**"
      - "**/cache/**"
    exclude_globs:
      - "**/mitmproxy-ca*"
      - "**/mitmproxy-dhparam*"
      - "**/*.pem"
      - "**/*.p12"
      - "**/*.p8"
      - "**/config.yaml"
      - "**/keys"
    delete_mode: contents
    max_depth: 3

  - id: net-outline-client-caches
    name: Outline Client caches and logs
    description: Outline VPN client caches/logs (App Store / Cordova layouts).
    category: app-cache
    platform: macos
    risk: report-only
