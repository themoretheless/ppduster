    delete_mode: contents
    max_depth: 6

  - id: net-lulu-caches-residual
    name: LuLu residual caches
    description: Objective-See LuLu firewall caches left after use or uninstall.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.objective-see.lulu
      - $HOME/Library/Caches/com.objective-see.lulu.helper
      - $HOME/Library/Logs/LuLu
