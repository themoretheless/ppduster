  - id: net-proxy-certs-license-never
    name: Proxy MITM certs and licenses inventory (report-only never-wipe)
    description: Explicit report-only list of known CA/license locations so cleaners do not target them.
    category: system-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
