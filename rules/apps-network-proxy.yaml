pack: apps-network-proxy
rules:

  - id: net-bruno-caches
    name: Bruno API client caches
    description: Bruno Electron caches and logs. Collections are git-friendly files outside this tree.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/bruno/Cache
      - $HOME/Library/Application Support/bruno/Code Cache
      - $HOME/Library/Application Support/bruno/GPUCache
      - $HOME/Library/Application Support/bruno/logs
      - $HOME/Library/Application Support/bruno/blob_storage
      - $HOME/Library/Application Support/bruno/Crashpad
      - $HOME/Library/Application Support/bruno/Service Worker
      - $HOME/Library/Caches/com.usebruno.app
      - $HOME/Library/Logs/bruno
      - $HOME/Library/Saved Application State/com.usebruno.app.savedState
    delete_mode: contents
    max_depth: 6

  - id: net-charles-caches-support
    name: Charles Proxy caches and support sessions
    description: Charles Application Support session/recording cache side data. Config/license stays out of default clean.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Charles
    exclude_globs:
      - "**/*.config"
      - "**/license*"
      - "**/License*"
    delete_mode: contents
    max_depth: 5

  - id: net-charles-savedstate-logs
    name: Charles saved state and residual logs
    description: Charles window restore and log leftovers.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Saved Application State/com.xk72.Charles.savedState
      - $HOME/Library/Logs/Charles
      - $HOME/Library/Caches/com.xk72.Charles
      - $HOME/Library/Caches/com.xk72.charles
    delete_mode: contents
    max_depth: 4

  - id: net-clash-verge-caches
    name: Clash Verge / Verge Rev caches
    description: Clash Verge (Tauri) and Clash Verge Rev caches and WebKit data.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/io.github.clash-verge-rev.clash-verge-rev
      - $HOME/Library/Caches/com.clashverge.dev
      - $HOME/Library/WebKit/io.github.clash-verge-rev.clash-verge-rev
      - $HOME/Library/WebKit/com.clashverge.dev
      - $HOME/Library/Logs/Clash Verge
      - $HOME/Library/Logs/io.github.clash-verge-rev.clash-verge-rev
      - $HOME/Library/Saved Application State/io.github.clash-verge-rev.clash-verge-rev.savedState
    delete_mode: contents
    max_depth: 6

  - id: net-clash-verge-config-report
    name: Clash Verge profiles and support (report-only)
    description: Clash Verge Rev support tree with profiles, clash core logs, and geo data.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/io.github.clash-verge-rev.clash-verge-rev
      - $HOME/Library/Application Support/com.clashverge.dev
      - $HOME/.local/share/io.github.clash-verge-rev.clash-verge-rev
      - $HOME/.config/clash-verge
    delete_mode: contents
    max_depth: 6

  - id: net-clashx-caches
    name: ClashX / ClashX Pro caches and logs
    description: ClashX menu-bar client caches and logs. Config/subscriptions separate.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.west2online.ClashX
      - $HOME/Library/Caches/com.west2online.ClashXPro
      - $HOME/Library/Logs/ClashX
      - $HOME/Library/Logs/com.west2online.ClashX
      - $HOME/Library/Logs/com.west2online.ClashXPro
      - $HOME/Library/HTTPStorages/com.west2online.ClashX
      - $HOME/Library/HTTPStorages/com.west2online.ClashXPro
      - $HOME/Library/Saved Application State/com.west2online.ClashX.savedState
      - $HOME/Library/Saved Application State/com.west2online.ClashXPro.savedState
    delete_mode: contents
    max_depth: 5

  - id: net-clashx-config-report
    name: ClashX config and profiles (report-only)
    description: ClashX Application Support and classic clash config home.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/com.west2online.ClashX
      - $HOME/Library/Application Support/com.west2online.ClashXPro
      - $HOME/.config/clash
      - $HOME/.config/clash.meta
    delete_mode: contents
    max_depth: 6

  - id: net-fiddler-everywhere-caches-logs
    name: Fiddler Everywhere caches and logs
    description: Fiddler Everywhere Electron caches and Logs folder. License excluded.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Fiddler Everywhere/Cache
      - $HOME/Library/Application Support/Fiddler Everywhere/Code Cache
      - $HOME/Library/Application Support/Fiddler Everywhere/GPUCache
      - $HOME/Library/Application Support/Fiddler Everywhere/Logs
      - $HOME/Library/Application Support/Fiddler Everywhere/logs
      - $HOME/Library/Application Support/Fiddler Everywhere/blob_storage
      - $HOME/Library/Application Support/Fiddler Everywhere/Crashpad
      - $HOME/Library/Caches/com.progress-telerik.fiddler
      - $HOME/Library/Caches/Fiddler Everywhere
      - $HOME/Library/Logs/Fiddler Everywhere
      - $HOME/Library/Saved Application State/com.progress-telerik.fiddler.savedState
    exclude_globs:
      - "**/License/**"
      - "**/license.lic"
      - "**/*.lic"
    delete_mode: contents
    max_depth: 6

  - id: net-fiddler-everywhere-support-report
    name: Fiddler Everywhere full support (report-only)
    description: Full Fiddler Everywhere tree including AutoSave/sessions and license.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/Fiddler Everywhere
    delete_mode: contents
    max_depth: 6

  - id: net-httpie-desktop-caches-logs
    name: HTTPie desktop caches and logs
    description: HTTPie for Desktop Electron caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/HTTPie/Cache
      - $HOME/Library/Application Support/HTTPie/Code Cache
      - $HOME/Library/Application Support/HTTPie/GPUCache
      - $HOME/Library/Application Support/HTTPie/logs
      - $HOME/Library/Application Support/HTTPie/blob_storage
      - $HOME/Library/Application Support/HTTPie/Crashpad
      - $HOME/Library/Logs/HTTPie
      - $HOME/Library/Caches/io.httpie.desktop
      - $HOME/Library/Saved Application State/io.httpie.desktop.savedState
    delete_mode: contents
    max_depth: 6

  - id: net-httptoolkit-caches-logs
    name: HTTP Toolkit caches and logs
    description: HTTP Toolkit Electron/server caches, logs, and browser-detect preference cache.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/HTTP Toolkit/Cache
      - $HOME/Library/Application Support/HTTP Toolkit/Code Cache
      - $HOME/Library/Application Support/HTTP Toolkit/GPUCache
      - $HOME/Library/Application Support/HTTP Toolkit/logs
      - $HOME/Library/Application Support/HTTP Toolkit/blob_storage
      - $HOME/Library/Application Support/HTTP Toolkit/Crashpad
      - $HOME/Library/Caches/httptoolkit-server
      - $HOME/Library/Logs/HTTP Toolkit
      - $HOME/Library/Preferences/httptoolkit
