    description: Full Paw container and Application Scripts residual inventory.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Containers/com.luckymarmot.Paw
      - $HOME/Library/Application Scripts/com.luckymarmot.Paw
    delete_mode: contents
    max_depth: 6

  - id: net-postman-intercept-residual
