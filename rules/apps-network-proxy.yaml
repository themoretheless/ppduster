    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/whistle-client/Cache
      - $HOME/Library/Application Support/whistle-client/Code Cache
      - $HOME/Library/Application Support/whistle-client/GPUCache
      - $HOME/Library/Application Support/whistle-client/logs
      - $HOME/Library/Application Support/Whistle/Cache
      - $HOME/Library/Application Support/Whistle/Code Cache
      - $HOME/Library/Application Support/Whistle/GPUCache
      - $HOME/Library/Application Support/Whistle/logs
      - $HOME/Library/Logs/whistle-client
      - $HOME/Library/Caches/whistle-client
    delete_mode: contents
    max_depth: 6

  - id: net-whistle-logs-cache
    name: Whistle proxy logs and cache data
    description: Whistle Node proxy crash log and cache under .WhistleAppData excluding certs/rules.
    category: app-cache
    platform: any
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/.WhistleAppData
    include_globs:
      - "**/*.log"
      - "**/whistle.log"
      - "**/cache/**"
      - "**/tmp/**"
      - "**/composer/**"
      - "**/capture/**"
    exclude_globs:
      - "**/certs/**"
      - "**/*ca*"
      - "**/*.crt"
      - "**/*.key"
      - "**/rules"
      - "**/values"
      - "**/properties"
    delete_mode: contents
    max_depth: 5

  - id: net-wireshark-caches
    name: Wireshark caches and HTTP/WebKit storage
    description: Wireshark app caches, cookies store, HTTPStorages, WebKit. Not profiles or captures.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/org.wireshark.Wireshark
      - $HOME/Library/HTTPStorages/org.wireshark.Wireshark
      - $HOME/Library/WebKit/org.wireshark.Wireshark
      - $HOME/Library/Saved Application State/org.wireshark.Wireshark.savedState
    delete_mode: contents
    max_depth: 5

  - id: net-wireshark-config-report
    name: Wireshark personal config and profiles (report-only)
    description: Wireshark personal configuration, colorfilters, profiles. Inventory only.
    category: app-cache
    platform: any
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.config/wireshark
      - $HOME/.wireshark
      - $HOME/Library/Application Support/Wireshark
    delete_mode: contents
    max_depth: 6
