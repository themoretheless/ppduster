      - $HOME/Library/Caches/at.obdev.LittleSnitchAgent
      - $HOME/Library/Caches/at.obdev.LittleSnitchConfiguration
      - $HOME/Library/Caches/at.obdev.LittleSnitchHelper
      - $HOME/Library/Caches/at.obdev.LittleSnitchSoftwareUpdate
      - $HOME/Library/Logs/Little Snitch Agent.log
      - $HOME/Library/Logs/Little Snitch Helper.log
      - $HOME/Library/Logs/Little Snitch Installer.log
      - $HOME/Library/Logs/Little Snitch Network Monitor.log
      - $HOME/Library/WebKit/at.obdev.LittleSnitchConfiguration
      - $HOME/Library/Saved Application State/at.obdev.LittleSnitchInstaller.savedState
