    max_depth: 6

  - id: net-httptoolkit-support-report
    name: HTTP Toolkit Application Support root (report-only)
    description: Full HTTP Toolkit support tree for size inventory.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/HTTP Toolkit
      - $HOME/Library/Saved Application State/tech.httptoolkit.desktop.savedState
    delete_mode: contents
    max_depth: 6

  - id: net-insomnia-residual
    name: Insomnia residual caches beyond primary
    description: Insomnia Service Worker, Session Storage, HTTPStorages residual beyond primary electron caches.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Insomnia/Service Worker
      - $HOME/Library/Application Support/Insomnia/Session Storage
      - $HOME/Library/Application Support/Insomnia/Local Storage
      - $HOME/Library/Application Support/Insomnia/Partitions
      - $HOME/Library/Application Support/Insomnia/Crashpad
      - $HOME/Library/HTTPStorages/com.insomnia.app
      - $HOME/Library/WebKit/com.insomnia.app
      - $HOME/Library/Saved Application State/com.insomnia.app.savedState
    delete_mode: contents
    max_depth: 6

  - id: net-little-snitch-caches-logs
    name: Little Snitch residual caches and logs
    description: User-scoped Little Snitch caches and agent logs after install/uninstall residual.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
