    delete_mode: contents
    max_depth: 8

  - id: jb-legacy-app-support-system
    name: Legacy Application Support system/caches residuals
    description: Older JetBrains layouts kept system caches under Application Support .../system or .../caches. Contents-only; never sibling options/plugins.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - "$HOME/Library/Application Support/JetBrains/IntelliJIdea*/system"
      - "$HOME/Library/Application Support/JetBrains/IntelliJIdea*/caches"
      - "$HOME/Library/Application Support/JetBrains/IdeaIC*/system"
      - "$HOME/Library/Application Support/JetBrains/WebStorm*/system"
      - "$HOME/Library/Application Support/JetBrains/WebStorm*/caches"
      - "$HOME/Library/Application Support/JetBrains/PyCharm*/system"
      - "$HOME/Library/Application Support/JetBrains/PyCharmCE*/system"
      - "$HOME/Library/Application Support/JetBrains/GoLand*/system"
      - "$HOME/Library/Application Support/JetBrains/CLion*/system"
      - "$HOME/Library/Application Support/JetBrains/Rider*/system"
      - "$HOME/Library/Application Support/JetBrains/RubyMine*/system"
      - "$HOME/Library/Application Support/JetBrains/PhpStorm*/system"
      - "$HOME/Library/Application Support/JetBrains/DataGrip*/system"
      - "$HOME/Library/Application Support/JetBrains/AppCode*/system"
      - "$HOME/Library/Application Support/JetBrains/MPS*/system"
    delete_mode: contents
    max_depth: 8

  - id: jb-localhistory-report
    name: IDE LocalHistory and fileHistory (report-only)
    description: Local edit history under system dirs. Inventory only; wiping loses per-file local history for that IDE version.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - "$HOME/Library/Caches/JetBrains/*/LocalHistory"
      - "$HOME/Library/Caches/JetBrains/*/fileHistory"
      - "$HOME/Library/Application Support/JetBrains/*/LocalHistory"
      - "$HOME/Library/Application Support/JetBrains/*/localHistory"
      - "$HOME/Library/Application Support/AndroidStudio*/localHistory"
    delete_mode: contents
    max_depth: 6

  - id: jb-mps-system-caches
    name: MPS system caches and logs
    description: JetBrains MPS (Meta Programming System) caches, index, logs.
    category: dev
    platform: macos
    risk: report-only
