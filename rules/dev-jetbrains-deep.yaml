  - id: jb-saved-state-residual
    name: JetBrains Saved Application State residual
    description: macOS window restoration state for JetBrains apps; regenerable.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - "$HOME/Library/Saved Application State/com.jetbrains.*"
    delete_mode: contents
    max_depth: 3

  - id: jb-shared-daemon-xdg
    name: JetBrains shared Daemon and XDG cache residuals
    description: Shared JetBrains Daemon/acp-agents under Caches and Linux-style ~/.cache/JetBrains on macOS.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/Library/Caches/JetBrains/Daemon
      - $HOME/Library/Caches/JetBrains/acp-agents
      - $HOME/Library/Logs/JetBrains/Daemon
      - $XDG_CACHE_HOME/JetBrains
    delete_mode: contents
    max_depth: 6

  - id: jb-toolbox-download-temp
    name: Toolbox download and temp caches
    description: Toolbox App download cache (installers/patches), temp, recovery. Safe; re-downloads as needed.
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 3
    paths:
      - $HOME/Library/Caches/JetBrains/Toolbox/download
      - $HOME/Library/Caches/JetBrains/Toolbox/temp
      - $HOME/Library/Caches/JetBrains/Toolbox/backup
      - $HOME/Library/Caches/JetBrains/Toolbox/recovery
      - $HOME/Library/Caches/JetBrains/Toolbox
    exclude_globs:
      - "**/ipc/**"
      - "**/ports/**"
      - "**/s-*"
    delete_mode: contents
    max_depth: 6

