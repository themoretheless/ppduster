      - "$HOME/Library/Caches/JetBrains/Rider*"
      - "$HOME/Library/Caches/JetBrains/Rider*/caches"
      - "$HOME/Library/Caches/JetBrains/Rider*/index"
      - "$HOME/Library/Caches/JetBrains/Rider*/tmp"
      - "$HOME/Library/Caches/JetBrains/Rider*/jcef_cache"
