pack: dev-jetbrains-deep
rules:

  - id: jb-android-studio-residual
    name: Android Studio residual caches and logs
    description: "Android Studio JetBrains-based system caches/logs beyond batch-08 mobile coverage: versioned Google and plain layouts, JetBrains/AndroidStudio system dirs."
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - "$HOME/Library/Caches/JetBrains/AndroidStudio*/caches"
      - "$HOME/Library/Caches/JetBrains/AndroidStudio*/index"
      - "$HOME/Library/Caches/JetBrains/AndroidStudio*/tmp"
      - "$HOME/Library/Logs/JetBrains/AndroidStudio*"
    exclude_globs:
      - "**/options/**"
      - "**/keymaps/**"
      - "**/plugins/**"
      - "**/codestyles/**"
    delete_mode: contents
    max_depth: 8

  - id: jb-appcode-logs
    name: AppCode logs residual
    description: AppCode residual logs.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - "$HOME/Library/Logs/JetBrains/AppCode*"
    delete_mode: contents
    max_depth: 6

  - id: jb-appcode-system-caches
    name: AppCode system caches and index
    description: AppCode (discontinued but residual) system caches on macOS.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - "$HOME/Library/Caches/JetBrains/AppCode*"
      - "$HOME/Library/Caches/JetBrains/AppCode*/caches"
      - "$HOME/Library/Caches/JetBrains/AppCode*/index"
      - "$HOME/Library/Caches/AppCode*"
    exclude_globs:
      - "**/LocalHistory/**"
      - "**/fileHistory/**"
    delete_mode: contents
    max_depth: 8

  - id: jb-clion-logs
    name: CLion logs
    description: CLion product logs.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
