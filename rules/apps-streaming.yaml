pack: apps-streaming
rules:

  - id: stream-camtasia-caches
    name: Camtasia caches and HTTPStorages
    description: TechSmith Camtasia regenerable caches. Not .tscproj projects or shared media libraries.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.techsmith.camtasia2024
      - $HOME/Library/Caches/com.techsmith.camtasia2025
      - $HOME/Library/Caches/com.techsmith.camtasia2026
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.techsmith.camtasia2024
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.techsmith.camtasia2025
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.techsmith.camtasia2026
      - $HOME/Library/HTTPStorages/com.techsmith.camtasia2024
      - $HOME/Library/HTTPStorages/com.techsmith.camtasia2025
      - $HOME/Library/HTTPStorages/com.techsmith.camtasia2026
      - $HOME/Library/Application Support/TechSmith/Camtasia 2024/Cache
      - $HOME/Library/Application Support/TechSmith/Camtasia 2025/Cache
      - $HOME/Library/Application Support/TechSmith/Camtasia 2026/Cache
      - $HOME/Library/Logs/TechSmith/Camtasia
      - $HOME/Library/Logs/Camtasia
    delete_mode: contents
    max_depth: 6

  - id: stream-camtasia-projects-report
    name: Camtasia projects and shared media (report-only)
    description: Camtasia project/media trees including /Users/Shared/TechSmith. Report only.
    category: media-library
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - /Users/Shared/TechSmith/Camtasia
      - $HOME/Library/Application Support/TechSmith/Camtasia 2024/Media
      - $HOME/Library/Application Support/TechSmith/Camtasia 2025/Media
      - $HOME/Library/Application Support/TechSmith/Camtasia 2026/Media
    delete_mode: contents
    max_depth: 5

  - id: stream-capcut-caches
    name: CapCut caches and container caches
    description: CapCut (com.lemon.lvoverseas) caches. Official clear path; drafts/projects not targeted here.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 5
    paths:
      - $HOME/Library/Caches/com.lemon.lvoverseas
      - $HOME/Library/Containers/com.lemon.lvoverseas/Data/Library/Caches
      - $HOME/Library/Containers/com.lemon.lvoverseas/Data/Library/Logs
      - $HOME/Library/Logs/CapCut
      - $HOME/Library/Logs/com.lemon.lvoverseas
    delete_mode: contents
    max_depth: 8

  - id: stream-capcut-drafts-report
    name: CapCut drafts and group container media (report-only)
    description: CapCut drafts/projects in group container or Movies. Report only.
    category: media-library
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Group Containers/22MMUN2RN5.lv
      - $HOME/Library/Containers/com.lemon.lvoverseas/Data/Documents
    delete_mode: contents
    max_depth: 6

