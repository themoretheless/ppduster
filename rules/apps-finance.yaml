pack: apps-finance
rules:

  - id: macos-finance-banktivity-caches
    name: Banktivity container caches
    description: Banktivity sandboxed Library/Caches only. Not document packages.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.iggsoftware.banktivity/Data/Library/Caches
      - $HOME/Library/Caches/com.iggsoftware.banktivity
      - $HOME/Library/Logs/Banktivity
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-binance-electron
    name: Binance desktop Electron caches and logs
    description: Binance Electron desktop caches and dedicated Logs tree (brew zap confirms roots).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 5
    paths:
      - $HOME/Library/Application Support/Binance/Cache
      - $HOME/Library/Application Support/Binance/Code Cache
      - $HOME/Library/Application Support/Binance/GPUCache
      - $HOME/Library/Application Support/Binance/DawnGraphiteCache
      - $HOME/Library/Application Support/Binance/DawnWebGPUCache
      - $HOME/Library/Application Support/Binance/blob_storage
      - $HOME/Library/Application Support/Binance/Crashpad
      - $HOME/Library/Application Support/Binance/logs
      - $HOME/Library/Logs/Binance
      - $HOME/Library/Caches/com.binance.BinanceDesktop
      - $HOME/Library/Caches/com.binance.binancedesktop
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-bloomberg-leftovers
    name: Bloomberg desktop leftovers (rare on Mac)
    description: Speculative Bloomberg Terminal/Anywhere cache or log leftovers if a Mac bridge/client was installed.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Bloomberg
      - $HOME/Library/Caches/com.bloomberg
      - $HOME/Library/Logs/Bloomberg
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-coinbase-electron
    name: Coinbase desktop Electron caches and logs
    description: Coinbase exchange/desktop Electron Chromium caches and logs only. Not wallet key material.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Coinbase/Cache
      - $HOME/Library/Application Support/Coinbase/Code Cache
      - $HOME/Library/Application Support/Coinbase/GPUCache
      - $HOME/Library/Application Support/Coinbase/logs
      - $HOME/Library/Application Support/Coinbase/Crashpad
      - $HOME/Library/Application Support/Coinbase Wallet/Cache
      - $HOME/Library/Application Support/Coinbase Wallet/Code Cache
      - $HOME/Library/Application Support/Coinbase Wallet/GPUCache
      - $HOME/Library/Application Support/Coinbase Wallet/logs
      - $HOME/Library/Caches/com.coinbase.wallet
      - $HOME/Library/Caches/com.coinbase.coinbase
      - $HOME/Library/Logs/Coinbase
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-ctrader-cache
    name: cTrader Mac desktop caches and logs
    description: cTrader native Mac / Spotware desktop Chromium or app caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/cTrader/Cache
      - $HOME/Library/Application Support/cTrader/Code Cache
      - $HOME/Library/Application Support/cTrader/GPUCache
      - $HOME/Library/Application Support/cTrader/logs
      - $HOME/Library/Application Support/Spotware/cTrader/Cache
      - $HOME/Library/Application Support/Spotware/cTrader/logs
      - $HOME/Library/Caches/com.spotware.ctradermac
      - $HOME/Library/Caches/com.spotware.ctrader
      - $HOME/Library/Logs/cTrader
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-electrum-logs-only
    name: Electrum wallet logs only
    description: Electrum log directory only under ~/.electrum. Never wallets/ or seed material.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/.electrum/logs
      - $HOME/Library/Logs/Electrum
    delete_mode: contents
    max_depth: 3

  - id: macos-finance-excel-addin-caches
    name: Excel finance add-in and WEF-related caches
    description: Excel stock connector / Office JS add-in web caches related to finance add-ins. Complements office pack WEF rules.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Containers/com.microsoft.Excel/Data/Library/Application Support/Microsoft/Office/16.0/Wef
      - $HOME/Library/Containers/com.Microsoft.OsfWebHost/Data/Library/Caches
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-exodus-logs-only
    name: Exodus wallet logs only
    description: Exodus desktop log files only. Never wallet SECO/seed/key material under Application Support/Exodus.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Exodus/logs
      - $HOME/Library/Logs/Exodus
      - $HOME/Library/Logs/com.electron.exodus
    delete_mode: contents
    max_depth: 4

  - id: macos-finance-gnucash-cache-logs
    name: GnuCash cache and logs
    description: GnuCash Application Support cache/log subtrees. Not GNC book files.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Gnucash/logs
      - $HOME/Library/Application Support/Gnucash/cache
      - $HOME/Library/Caches/org.gnucash.Gnucash
      - $HOME/Library/Logs/Gnucash
      - $HOME/Library/Logs/org.gnucash.Gnucash
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-ibkr-desktop-electron
    name: IBKR Desktop app support caches and logs
    description: Newer IBKR Desktop (NTWS) Application Support Chromium-style caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/IBKR Desktop/Cache
      - $HOME/Library/Application Support/IBKR Desktop/Code Cache
      - $HOME/Library/Application Support/IBKR Desktop/GPUCache
      - $HOME/Library/Application Support/IBKR Desktop/logs
      - $HOME/Library/Application Support/IBKR Desktop/Crashpad
      - $HOME/Library/Application Support/IBKR Desktop/blob_storage
      - $HOME/Library/Logs/IBKR Desktop
      - $HOME/Library/Caches/com.install4j.5557-0173-2810-0000
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-ibkr-tws-logs
    name: Interactive Brokers TWS/Gateway logs under Jts
    description: TWS and IB Gateway day logs and API message logs under default Mac settings dirs. Not tws.xml or full settings trees.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Jts
      - $HOME/IBJts
    include_globs:
      - "**/log.*.txt"
      - "**/log.*.txt.enc"
      - "**/api.*.log"
      - "**/api.*.log.enc"
      - "**/*.log"
      - "**/*.log.enc"
      - "**/log/*"
      - "**/logs/*"
    exclude_globs:
      - "**/tws.xml"
      - "**/jts.ini"
      - "**/ibgateway.ini"
      - "**/*.jar"
      - "**/*.xml"
    delete_mode: contents
    max_depth: 4

  - id: macos-finance-kraken-electron
    name: Kraken Pro / desktop caches and logs
    description: Kraken Pro desktop Electron caches if installed.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Kraken/Cache
      - $HOME/Library/Application Support/Kraken/Code Cache
      - $HOME/Library/Application Support/Kraken/GPUCache
      - $HOME/Library/Application Support/Kraken/logs
      - $HOME/Library/Application Support/Kraken Pro/Cache
      - $HOME/Library/Application Support/Kraken Pro/Code Cache
      - $HOME/Library/Application Support/Kraken Pro/GPUCache
      - $HOME/Library/Application Support/Kraken Pro/logs
      - $HOME/Library/Caches/com.kraken.desktop
      - $HOME/Library/Logs/Kraken
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-ledger-live-cache
    name: Ledger Live / Ledger Wallet Electron caches
    description: Ledger Live (renamed Ledger Wallet) Chromium Cache/Code Cache/GPUCache/logs only. Not device data or app.json.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Ledger Live/Cache
      - $HOME/Library/Application Support/Ledger Live/Code Cache
      - $HOME/Library/Application Support/Ledger Live/GPUCache
      - $HOME/Library/Application Support/Ledger Live/DawnGraphiteCache
      - $HOME/Library/Application Support/Ledger Live/DawnWebGPUCache
      - $HOME/Library/Application Support/Ledger Live/blob_storage
      - $HOME/Library/Application Support/Ledger Live/Crashpad
      - $HOME/Library/Application Support/Ledger Live/logs
      - $HOME/Library/Application Support/Ledger Wallet/Cache
      - $HOME/Library/Application Support/Ledger Wallet/Code Cache
      - $HOME/Library/Application Support/Ledger Wallet/GPUCache
      - $HOME/Library/Application Support/Ledger Wallet/logs
      - $HOME/Library/Application Support/Ledger Wallet/Crashpad
      - $HOME/Library/Logs/Ledger Live
      - $HOME/Library/Logs/Ledger Wallet
      - $HOME/Library/Caches/com.ledger.live
      - $HOME/Library/Caches/com.ledger.live.ShipIt
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-metatrader4-logs-cache
    name: MetaTrader 4 Wine logs
    description: MT4 Mac Wine-prefix Logs only (legacy platform).
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/net.metaquotes.wine.metatrader4/drive_c/Program Files/MetaTrader 4/logs
      - $HOME/Library/Application Support/net.metaquotes.wine.metatrader4/drive_c/Program Files/MetaTrader 4/MQL4/Logs
      - $HOME/Library/Application Support/MetaTrader 4/Bottles/metatrader4/drive_c/Program Files/MetaTrader 4/logs
      - $HOME/Library/Application Support/MetaTrader 4/Bottles/metatrader4/drive_c/Program Files/MetaTrader 4/MQL4/Logs
      - $HOME/Library/Caches/net.metaquotes.wine.metatrader4
    delete_mode: contents
    max_depth: 8

  - id: macos-finance-metatrader5-logs-cache
    name: MetaTrader 5 Wine logs and chart bar caches
    description: MT5 Mac Wine-prefix platform Logs and regenerable Bases cache bars. Not bottle root, MQL5 EAs, profiles, or templates.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/Logs
      - $HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/MQL5/Logs
      - $HOME/Library/Application Support/MetaTrader 5/Bottles/metatrader5/drive_c/Program Files/MetaTrader 5/Logs
      - $HOME/Library/Application Support/MetaTrader 5/Bottles/metatrader5/drive_c/Program Files/MetaTrader 5/MQL5/Logs
      - $HOME/Library/Logs/MetaTrader 5
      - $HOME/Library/Caches/net.metaquotes.wine.metatrader5
    delete_mode: contents
    max_depth: 8

  - id: macos-finance-moneymoney-caches
    name: MoneyMoney caches only
    description: MoneyMoney App Store/sandbox caches. Not Containers account database.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.moneymoney-app.retail
      - $HOME/Library/Containers/com.moneymoney-app.retail/Data/Library/Caches
      - $HOME/Library/Containers/MoneyMoney/Data/Library/Caches
      - $HOME/Library/Logs/MoneyMoney
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-quicken-caches
    name: Quicken Mac caches and HTTP storage
    description: Quicken regenerable caches under Library/Caches and App Support cache subtrees. Not Quicken data files.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.quicken.Quicken
      - $HOME/Library/HTTPStorages/com.quicken.Quicken
      - $HOME/Library/Application Support/Quicken/Caches
      - $HOME/Library/Application Support/Quicken/Logs
      - $HOME/Library/Logs/Quicken
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-robinhood-webview
    name: Robinhood incidental webview/Electron leftovers
    description: No first-party Mac desktop; clean only incidental Electron/webview cache folders if present.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Robinhood/Cache
      - $HOME/Library/Application Support/Robinhood/Code Cache
      - $HOME/Library/Application Support/Robinhood/GPUCache
      - $HOME/Library/Application Support/Robinhood/logs
      - $HOME/Library/Caches/com.robinhood.Robinhood
      - $HOME/Library/Logs/Robinhood
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-tastytrade-webull
    name: tastytrade and Webull Desktop caches
    description: "Additional US broker desktop Electron/Java caches common on Mac traders' machines."
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/tastytrade/Cache
      - $HOME/Library/Application Support/tastytrade/Code Cache
      - $HOME/Library/Application Support/tastytrade/GPUCache
      - $HOME/Library/Application Support/tastytrade/logs
      - $HOME/Library/Application Support/tastytrade/Crashpad
      - $HOME/Library/Application Support/Webull Desktop/Cache
      - $HOME/Library/Application Support/Webull Desktop/Code Cache
      - $HOME/Library/Application Support/Webull Desktop/GPUCache
      - $HOME/Library/Application Support/Webull Desktop/logs
      - $HOME/Library/Logs/tastytrade
      - $HOME/Library/Logs/Webull Desktop
      - $HOME/Library/Caches/com.tastytrade.desktop
      - $HOME/Library/Caches/com.webull.desktop
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-thinkorswim-logs-cache
    name: thinkorswim logs and update/cache trees
    description: Schwab thinkorswim Java client logs and regenerable update caches. Not full workspace or login state.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/.thinkorswim/logs
      - $HOME/Library/Application Support/thinkorswim/logs
      - $HOME/thinkorswim/logs
      - $HOME/thinkorswim/usergui
      - $HOME/Library/Logs/thinkorswim
      - $HOME/Library/Caches/com.install4j.thinkorswim
      - $HOME/Library/Caches/thinkorswim
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-tradingview-electron
    name: TradingView Desktop Electron caches and logs
    description: TradingView Desktop Chromium caches, GPU/Dawn caches, Crashpad, and logs. Chart layouts stay in non-cache profile state.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 5
    paths:
      - $HOME/Library/Application Support/TradingView/Cache
      - $HOME/Library/Application Support/TradingView/Code Cache
      - $HOME/Library/Application Support/TradingView/GPUCache
      - $HOME/Library/Application Support/TradingView/DawnGraphiteCache
      - $HOME/Library/Application Support/TradingView/DawnWebGPUCache
      - $HOME/Library/Application Support/TradingView/blob_storage
      - $HOME/Library/Application Support/TradingView/Crashpad
      - $HOME/Library/Application Support/TradingView/logs
      - $HOME/Library/Application Support/TradingView/Service Worker/CacheStorage
      - $HOME/Library/Caches/com.tradingview.tradingviewapp.desktop
      - $HOME/Library/Caches/com.tradingview.tradingviewapp.desktop.ShipIt
      - $HOME/Library/Logs/TradingView
    delete_mode: contents
    max_depth: 6

  - id: macos-finance-trezor-suite-cache
    name: Trezor Suite desktop Chromium caches
    description: "Trezor Suite Electron caches under @trezor/suite-desktop. Not remembered-wallet state."
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - "$HOME/Library/Application Support/@trezor/suite-desktop/Cache"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/Code Cache"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/GPUCache"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/DawnGraphiteCache"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/DawnWebGPUCache"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/blob_storage"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/Crashpad"
      - "$HOME/Library/Application Support/@trezor/suite-desktop/logs"
      - "$HOME/Library/Logs/@trezor"
      - $HOME/Library/Logs/Trezor Suite
      - $HOME/Library/Caches/io.trezor.TrezorSuite
    delete_mode: contents
    max_depth: 5

  - id: macos-finance-wallet-logs-adjacent-report
    name: Other wallet app log trees (report-only)
    description: Logs-only inventory for secondary wallet apps. Never wallet data roots.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 14
    paths:
      - $HOME/Library/Logs/atomic
      - $HOME/Library/Application Support/atomic/logs
      - $HOME/Library/Logs/BlueWallet
      - $HOME/.walletwasabi/client/Logs
      - $HOME/Library/Logs/monero-wallet-gui
    delete_mode: contents
    max_depth: 3

  - id: macos-finance-yahoo-finance-caches
    name: Yahoo Finance Mac app container caches
    description: App Store / container caches for Yahoo Finance if installed; not web browser history.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.yahoo.finance/Data/Library/Caches
      - $HOME/Library/Caches/com.yahoo.finance
      - $HOME/Library/Caches/com.yahoo.Aerodrome
      - $HOME/Library/Logs/Yahoo Finance
