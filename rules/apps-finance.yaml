    max_depth: 6

  - id: macos-finance-ynab-monarch-mint
    name: YNAB / Monarch / Mint desktop leftovers
    description: Best-effort Electron or container caches for budget apps. Mint has no durable Mac desktop.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/YNAB/Cache
      - $HOME/Library/Application Support/YNAB/Code Cache
      - $HOME/Library/Application Support/YNAB/GPUCache
      - $HOME/Library/Application Support/YNAB/logs
      - $HOME/Library/Application Support/ynab/Cache
      - $HOME/Library/Application Support/Monarch Money/Cache
      - $HOME/Library/Application Support/Monarch Money/Code Cache
      - $HOME/Library/Application Support/Monarch Money/GPUCache
      - $HOME/Library/Application Support/Monarch Money/logs
      - $HOME/Library/Application Support/Monarch/Cache
      - $HOME/Library/Caches/com.youneedabudget.ynab
      - $HOME/Library/Caches/com.monarchmoney.desktop
      - $HOME/Library/Logs/YNAB
      - $HOME/Library/Logs/Monarch Money
    delete_mode: contents
    max_depth: 6
