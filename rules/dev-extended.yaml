pack: dev-extended
rules:

  - id: dev-android-avd-report
    name: Android AVDs (report-only)
    description: User AVD definitions and data; never auto-delete.
    category: dev
    platform: any
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.android/avd
    delete_mode: path
    max_depth: 3

  - id: dev-android-emulator-cache
    name: Android emulator intermediate cache
    description: Emulator skins/snapshots temp under SDK (not AVD data).
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/Library/Android/sdk/emulator/qemu_pipe
      - $HOME/.android/cache/ddms
    delete_mode: contents
    max_depth: 4

  - id: dev-android-ndk-report
    name: Android NDK (report-only)
    description: Installed NDK trees; large and versioned, report only.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Android/sdk/ndk
      - $HOME/Library/Android/sdk/ndk-bundle
    delete_mode: path
    max_depth: 3

  - id: dev-android-sdk-caches
    name: Android SDK download and build caches
    description: Android SDK intermediate download and build-cache folders (not platforms).
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/Library/Android/sdk/.downloadIntermediates
      - $HOME/Library/Android/sdk/caches
      - $HOME/Library/Android/sdk/build-cache
      - $HOME/Library/Android/sdk/.temp
      - $HOME/.android/cache
      - $HOME/.android/build-cache
    delete_mode: contents
    max_depth: 5

  - id: dev-android-studio-logs
    name: Android Studio logs
    description: Android Studio logs under Library/Logs.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Logs/Google/AndroidStudio
      - $HOME/Library/Logs/AndroidStudio
    delete_mode: contents
    max_depth: 5

  - id: dev-android-system-images-report
    name: Android emulator system images (report-only)
    description: AVD system images under SDK; report size only.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Android/sdk/system-images
    delete_mode: path
    max_depth: 4

  - id: dev-asdf-downloads
    name: asdf downloads and tmp
    description: asdf plugin download staging (not installed tool versions).
    category: package-cache
    platform: any
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/.asdf/downloads
      - $HOME/.asdf/tmp
    delete_mode: contents
    max_depth: 5

  - id: dev-asdf-installs-report
    name: asdf installed toolchains (report-only)
    description: asdf installs tree; report size only.
    category: dev
    platform: any
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.asdf/installs
    delete_mode: path
    max_depth: 3

  - id: dev-bazel-cache
    name: Bazel disk cache
    description: Bazel output and disk caches under home.
    category: package-cache
    platform: any
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/.cache/bazel
