pack: macos-browsers
rules:

  - id: macos-arc-dia-shader-root
    name: Arc and Dia root Graphite/component caches
    description: Browser-root GraphiteDawnCache and component caches for Arc and Dia User Data trees.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Arc/User Data/GraphiteDawnCache
      - $HOME/Library/Application Support/Arc/User Data/GrShaderCache
      - $HOME/Library/Application Support/Arc/User Data/ShaderCache
      - $HOME/Library/Application Support/Dia/User Data/GraphiteDawnCache
      - $HOME/Library/Application Support/Dia/User Data/GrShaderCache
      - $HOME/Library/Application Support/Dia/User Data/ShaderCache
      - $HOME/Library/Application Support/Dia/User Data/component_crx_cache
    delete_mode: contents
    max_depth: 3

  - id: macos-browser-webkit-shared
    name: Shared WebKit process caches for browsers
    description: Per-bundle-id WebKit directory caches for browsers that use system WebKit.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/WebKit/com.apple.Safari
      - $HOME/Library/WebKit/com.google.Chrome
      - $HOME/Library/WebKit/com.microsoft.edgemac
      - $HOME/Library/WebKit/com.brave.Browser
      - $HOME/Library/WebKit/com.operasoftware.Opera
      - $HOME/Library/WebKit/company.thebrowser.Browser
      - $HOME/Library/WebKit/company.thebrowser.dia
    delete_mode: contents
    max_depth: 4

  - id: macos-chrome-channels-http-cache
    name: Chrome channel HTTP and code caches (Library/Caches)
    description: Disk HTTP Cache, Code Cache, Media Cache under Library/Caches for Chrome stable/beta/dev/canary/for-testing.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/Google/Chrome Beta
      - $HOME/Library/Caches/Google/Chrome Canary
      - $HOME/Library/Caches/Google/Chrome Dev
      - $HOME/Library/Caches/Google/Chrome for Testing
      - $HOME/Library/Caches/com.google.Chrome
      - $HOME/Library/Caches/com.google.Chrome.beta
      - $HOME/Library/Caches/com.google.Chrome.canary
      - $HOME/Library/Caches/com.google.Chrome.dev
    include_globs:
      - "**/Cache/**"
      - "**/Code Cache/**"
      - "**/Media Cache/**"
      - "**/Storage/**"
    delete_mode: contents
    max_depth: 6

  - id: macos-chrome-channels-profile-disk-cache
    name: Chrome channel profile HTTP Cache (Application Support)
    description: Per-profile Cache and Media Cache leaves inside Chrome channel user-data trees when cache lives under Application Support.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Google/Chrome Beta
      - $HOME/Library/Application Support/Google/Chrome Canary
      - $HOME/Library/Application Support/Google/Chrome Dev
      - $HOME/Library/Application Support/Google/Chrome for Testing
      - $HOME/Library/Application Support/Google/ChromeForTesting
    include_globs:
      - "**/Cache/**"
      - "**/Media Cache/**"
      - "**/Application Cache/**"
    exclude_globs:
      - "**/Cookies*"
      - "**/Login Data*"
      - "**/Web Data*"
      - "**/History*"
      - "**/Bookmarks*"
      - "**/Local Storage/**"
      - "**/Session Storage/**"
      - "**/Sessions/**"
      - "**/IndexedDB/**"
    delete_mode: contents
    max_depth: 6

  - id: macos-chrome-helper-caches
    name: Chrome helper and Keystone residual caches
    description: Google Chrome helper process caches and non-profile Keystone agent caches (not full updater wipe).
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.google.Chrome.helper
      - $HOME/Library/Caches/com.google.Chrome.helper.renderer
      - $HOME/Library/Caches/com.google.Chrome.helper.plugin
      - $HOME/Library/Caches/com.google.Keystone
      - $HOME/Library/Caches/com.google.Keystone.Agent
      - $HOME/Library/Caches/com.google.GoogleUpdater
    delete_mode: contents
    max_depth: 4

  - id: macos-chromium-component-crx-cache
    name: Chromium Component and extension CRX caches
    description: component_crx_cache and extensions_crx_cache holding downloaded component/extension package blobs.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Google/Chrome/component_crx_cache
      - $HOME/Library/Application Support/Google/Chrome/extensions_crx_cache
      - $HOME/Library/Application Support/Google/Chrome Beta/component_crx_cache
      - $HOME/Library/Application Support/Google/Chrome Canary/component_crx_cache
      - $HOME/Library/Application Support/Google/Chrome Dev/component_crx_cache
      - $HOME/Library/Application Support/Chromium/component_crx_cache
      - $HOME/Library/Application Support/BraveSoftware/Brave-Browser/component_crx_cache
      - $HOME/Library/Application Support/Microsoft Edge/component_crx_cache
      - $HOME/Library/Application Support/Microsoft Edge/extensions_crx_cache
      - $HOME/Library/Application Support/Vivaldi/component_crx_cache
      - $HOME/Library/Application Support/Arc/User Data/component_crx_cache
      - $HOME/Library/Application Support/Dia/User Data/component_crx_cache
      - $HOME/Library/Application Support/com.operasoftware.Opera/component_crx_cache
      - $HOME/Library/Application Support/com.operasoftware.OperaGX/component_crx_cache
      - $HOME/Library/Application Support/Sidekick/component_crx_cache
    delete_mode: contents
    max_depth: 3

  - id: macos-chromium-crashpad
    name: Chromium-family Crashpad reports
    description: Crashpad completed/pending crash minidumps for Chromium browsers. Safe to clear.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Google/Chrome/Crashpad
      - $HOME/Library/Application Support/Google/Chrome Beta/Crashpad
      - $HOME/Library/Application Support/Google/Chrome Canary/Crashpad
      - $HOME/Library/Application Support/Google/Chrome Dev/Crashpad
      - $HOME/Library/Application Support/Chromium/Crashpad
      - $HOME/Library/Application Support/BraveSoftware/Brave-Browser/Crashpad
      - $HOME/Library/Application Support/Microsoft Edge/Crashpad
      - $HOME/Library/Application Support/Microsoft Edge Beta/Crashpad
      - $HOME/Library/Application Support/Vivaldi/Crashpad
      - $HOME/Library/Application Support/Arc/User Data/Crashpad
      - $HOME/Library/Application Support/Dia/User Data/Crashpad
      - $HOME/Library/Application Support/com.operasoftware.Opera/Crashpad
      - $HOME/Library/Application Support/com.operasoftware.OperaGX/Crashpad
      - $HOME/Library/Application Support/Sidekick/Crashpad
    include_globs:
      - "**/completed/**"
      - "**/pending/**"
      - "**/new/**"
      - "**/attachments/**"
    exclude_globs:
      - "**/settings.dat"
      - "**/client_id"
    delete_mode: contents
    max_depth: 4

  - id: macos-chromium-dawn-gpu-extra-leaves
    name: Chromium Dawn/WebGPU/GPUPersistent leaves (stable family)
    description: "Additional GPU-related regenerable leaves under main Chromium-family profiles: DawnGraphiteCache, DawnWebGPUCache, GPUPersistentCache."
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Arc/User Data
    include_globs:
      - "**/DawnGraphiteCache/**"
      - "**/DawnWebGPUCache/**"
      - "**/GPUPersistentCache/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-chromium-extra-channels-code-gpu
    name: Extra Chromium channels code/GPU/Dawn/Shader caches
    description: "Code Cache, GPUCache, Dawn*, GrShader, Shader for channels not fully covered: Chrome Beta/Canary/Dev/for-Testing, Brave Beta/Nightly, Edge Beta/Canary/Dev, Opera, Opera GX, Dia, Sidekick."
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Google/Chrome Beta
      - $HOME/Library/Application Support/Google/Chrome Canary
      - $HOME/Library/Application Support/Google/Chrome Dev
      - $HOME/Library/Application Support/Google/Chrome for Testing
      - $HOME/Library/Application Support/Google/ChromeForTesting
      - $HOME/Library/Application Support/BraveSoftware/Brave-Browser-Beta
      - $HOME/Library/Application Support/BraveSoftware/Brave-Browser-Nightly
      - $HOME/Library/Application Support/Microsoft Edge Beta
      - $HOME/Library/Application Support/Microsoft Edge Canary
      - $HOME/Library/Application Support/Microsoft Edge Dev
      - $HOME/Library/Application Support/com.operasoftware.Opera
      - $HOME/Library/Application Support/com.operasoftware.OperaGX
      - $HOME/Library/Application Support/Dia/User Data
      - $HOME/Library/Application Support/Sidekick
    include_globs:
      - "**/Code Cache/**"
      - "**/GPUCache/**"
      - "**/DawnCache/**"
      - "**/DawnGraphiteCache/**"
      - "**/DawnWebGPUCache/**"
      - "**/GrShaderCache/**"
      - "**/GraphiteDawnCache/**"
      - "**/ShaderCache/**"
      - "**/GPUPersistentCache/**"
    delete_mode: contents
    max_depth: 6

  - id: macos-chromium-family-http-cache
    name: Chromium-family HTTP caches (Library/Caches)
    description: HTTP/disk caches for Chromium, Brave, Edge, Vivaldi, Opera, Arc, Dia, Sidekick under Library/Caches.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/Chromium
      - $HOME/Library/Caches/BraveSoftware/Brave-Browser
      - $HOME/Library/Caches/BraveSoftware/Brave-Browser-Beta
      - $HOME/Library/Caches/BraveSoftware/Brave-Browser-Nightly
      - $HOME/Library/Caches/Microsoft Edge
      - $HOME/Library/Caches/Microsoft Edge Beta
      - $HOME/Library/Caches/Microsoft Edge Canary
      - $HOME/Library/Caches/Microsoft Edge Dev
      - $HOME/Library/Caches/com.microsoft.edgemac
      - $HOME/Library/Caches/com.microsoft.edgemac.beta
      - $HOME/Library/Caches/com.microsoft.edgemac.canary
      - $HOME/Library/Caches/com.microsoft.edgemac.dev
      - $HOME/Library/Caches/Vivaldi
      - $HOME/Library/Caches/com.operasoftware.Opera
      - $HOME/Library/Caches/com.operasoftware.OperaGX
      - $HOME/Library/Caches/com.operasoftware.OperaCrypto
      - $HOME/Library/Caches/Arc
      - $HOME/Library/Caches/company.thebrowser.Browser
      - $HOME/Library/Caches/Dia
      - $HOME/Library/Caches/company.thebrowser.dia
      - $HOME/Library/Caches/Sidekick
      - $HOME/Library/Caches/com.pushplaylabs.sidekick
    include_globs:
      - "**/Cache/**"
      - "**/Code Cache/**"
      - "**/Media Cache/**"
      - "**/User Data/**/Cache/**"
      - "**/User Data/**/Code Cache/**"
    delete_mode: contents
    max_depth: 8

  - id: macos-chromium-optimization-guide
    name: Chromium OptimizationGuide model caches
    description: On-device Optimization Guide model/hint stores used by Chrome and Edge.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Google/Chrome/optimization_guide_model_store
      - $HOME/Library/Application Support/Google/Chrome/OptimizationHints
      - $HOME/Library/Application Support/Google/Chrome Canary/optimization_guide_model_store
      - $HOME/Library/Application Support/Google/Chrome Dev/optimization_guide_model_store
      - $HOME/Library/Application Support/Microsoft Edge/optimization_guide_model_store
      - $HOME/Library/Application Support/Microsoft Edge/OptimizationHints
      - $HOME/Library/Application Support/BraveSoftware/Brave-Browser/optimization_guide_model_store
      - $HOME/Library/Application Support/Vivaldi/optimization_guide_model_store
      - $HOME/Library/Application Support/Arc/User Data/optimization_guide_model_store
    delete_mode: contents
    max_depth: 4

  - id: macos-chromium-optimization-hint-profile
    name: Chromium per-profile optimization hint cache
    description: Per-profile optimization_guide_hint_cache_store files under Chromium-family profiles.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Arc/User Data
    include_globs:
      - "**/optimization_guide_hint_cache_store*"
      - "**/AutofillAiModelCache/**"
      - "**/VideoDecodeStats/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-chromium-service-worker-cache
    name: Chromium Service Worker CacheStorage and ScriptCache
    description: PWA/service-worker script and Cache Storage under profiles. Regenerable but can force offline apps to re-download.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Google/Chrome Beta
      - $HOME/Library/Application Support/Google/Chrome Canary
      - $HOME/Library/Application Support/Google/Chrome Dev
      - $HOME/Library/Application Support/Arc/User Data
      - $HOME/Library/Application Support/Dia/User Data
      - $HOME/Library/Application Support/com.operasoftware.Opera
      - $HOME/Library/Application Support/com.operasoftware.OperaGX
      - $HOME/Library/Application Support/Sidekick
    include_globs:
      - "**/Service Worker/CacheStorage/**"
      - "**/Service Worker/ScriptCache/**"
    exclude_globs:
      - "**/Service Worker/Database/**"
    delete_mode: contents
    max_depth: 8

  - id: macos-duckduckgo-browser-cache
    name: DuckDuckGo browser cache
    description: DuckDuckGo macOS browser Caches, WebKit, and container cache.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.duckduckgo.macos.browser
      - $HOME/Library/WebKit/com.duckduckgo.macos.browser
      - $HOME/Library/HTTPStorages/com.duckduckgo.macos.browser
      - $HOME/Library/Containers/com.duckduckgo.macos.browser/Data/Library/Caches
      - $HOME/Library/Application Support/com.duckduckgo.macos.browser/Cache
      - $HOME/Library/Application Support/DuckDuckGo/Cache
    delete_mode: contents
    max_depth: 5

  - id: macos-edge-updater-and-edgemac-cache
    name: Edge helper and edgemac residual caches
    description: com.microsoft.edgemac nsurl cache DBs and Edge updater residual caches.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.microsoft.edgemac
      - $HOME/Library/Caches/com.microsoft.EdgeUpdater
      - $HOME/Library/Caches/Microsoft Edge/Default/Cache
      - $HOME/Library/Caches/Microsoft Edge/Default/Code Cache
    delete_mode: contents
    max_depth: 4

  - id: macos-firefox-extra-profile-caches
    name: Firefox OfflineCache, shader-cache, thumbnails
    description: Extra regenerable Firefox caches beyond cache2/startupCache already shipped.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/org.mozilla.firefox
      - $HOME/Library/Application Support/Firefox/Profiles
    include_globs:
      - "*/OfflineCache/**"
      - "*/shader-cache/**"
      - "*/startupCache/**"
      - "*/thumbnails/**"
      - "*/safebrowsing/**"
    exclude_globs:
      - "*/cookies.sqlite*"
      - "*/logins.json"
      - "*/key4.db"
      - "*/places.sqlite*"
      - "*/permissions.sqlite*"
      - "*/storage/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-firefox-forks-cache
    name: Firefox-fork browser caches
    description: cache2/startupCache for Waterfox, LibreWolf, Floorp, Zen Browser, Mullvad Browser.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/Waterfox
      - $HOME/Library/Caches/librewolf
      - $HOME/Library/Caches/floorp
      - $HOME/Library/Caches/zen
      - $HOME/Library/Caches/MullvadBrowser
      - $HOME/Library/Caches/org.mozilla.waterfox
      - $HOME/Library/Caches/io.gitlab.librewolf-community
      - $HOME/Library/Application Support/Waterfox
      - $HOME/Library/Application Support/librewolf
      - $HOME/Library/Application Support/Floorp
      - $HOME/Library/Application Support/zen
      - $HOME/Library/Application Support/MullvadBrowser
    include_globs:
      - "**/cache2/**"
      - "**/startupCache/**"
      - "**/OfflineCache/**"
      - "**/shader-cache/**"
      - "**/jumpListCache/**"
    exclude_globs:
      - "**/cookies.sqlite*"
      - "**/logins.json"
      - "**/key4.db"
      - "**/places.sqlite*"
    delete_mode: contents
    max_depth: 8

  - id: macos-orion-webkit-cache
    name: Orion (Kagi) WebKit and app cache
    description: Orion browser app cache and WebKit disk cache.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.kagi.kagimacOS
      - $HOME/Library/Caches/com.kagi.kagimacOS.IconService
      - $HOME/Library/WebKit/com.kagi.kagimacOS
      - $HOME/Library/Application Support/Orion/Defaults/Cache
      - $HOME/Library/Application Support/Orion/Defaults/WebKit
    delete_mode: contents
    max_depth: 5

  - id: macos-safari-safebrowsing-cache-ext
    name: Safari Safe Browsing cache
    description: Google/Apple Safe Browsing threat list cache used by Safari.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.apple.Safari.SafeBrowsing
    delete_mode: contents
    max_depth: 4

  - id: macos-safari-webkit-disk-cache
    name: Safari WebKit HTTP disk cache
    description: Safari/WebKit HTTP and resource disk caches in legacy Caches and sandboxed container. Rebuilds on browse.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.apple.Safari/WebKitCache
      - $HOME/Library/Caches/com.apple.Safari/fsCachedData
      - $HOME/Library/Containers/com.apple.Safari/Data/Library/Caches/com.apple.Safari/WebKitCache
      - $HOME/Library/Containers/com.apple.Safari/Data/Library/Caches/com.apple.Safari/fsCachedData
      - $HOME/Library/Containers/com.apple.Safari/Data/Library/Caches/com.apple.Safari/TabSnapshots
      - $HOME/Library/Containers/com.apple.Safari/Data/Library/Caches/WebKit
    delete_mode: contents
    max_depth: 6

  - id: macos-sigmaos-cache
    name: SigmaOS browser cache
    description: SigmaOS WebKit/Chromium hybrid app and WebKit caches.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.sigmaos.sigmaos.macos
      - $HOME/Library/Caches/company.sigmaos.sigmaos.macos
      - $HOME/Library/WebKit/com.sigmaos.sigmaos.macos
      - $HOME/Library/Application Support/SigmaOS/Cache
      - $HOME/Library/Application Support/com.sigmaos.sigmaos.macos/Cache
    delete_mode: contents
    max_depth: 5

  - id: macos-tor-browser-cache
    name: Tor Browser cache
    description: Tor Browser profile disk caches under TorBrowser-Data (Firefox ESR layout).
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/TorBrowser-Data/Browser
      - $HOME/Library/Caches/TorBrowser-Data
      - $HOME/Library/Caches/org.torproject.torbrowser
    include_globs:
      - "**/cache2/**"
      - "**/startupCache/**"
      - "**/OfflineCache/**"
      - "**/shader-cache/**"
      - "**/thumbnails/**"
    exclude_globs:
      - "**/cookies.sqlite*"
      - "**/places.sqlite*"
      - "**/logins.json"
      - "**/key4.db"
      - "**/prefs.js"
    delete_mode: contents
    max_depth: 8

  - id: macos-yandex-browser-cache
    name: Yandex Browser cache
    description: Yandex Browser Chromium-based HTTP/GPU/code caches.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/Yandex/YandexBrowser
      - $HOME/Library/Application Support/Yandex/YandexBrowser
    include_globs:
      - "**/Cache/**"
      - "**/Code Cache/**"
      - "**/GPUCache/**"
      - "**/Media Cache/**"
      - "**/DawnCache/**"
      - "**/DawnGraphiteCache/**"
      - "**/ShaderCache/**"
      - "**/GrShaderCache/**"
      - "**/Service Worker/CacheStorage/**"
      - "**/component_crx_cache/**"
    exclude_globs:
      - "**/Cookies*"
      - "**/Login Data*"
      - "**/Web Data*"
      - "**/History*"
      - "**/Bookmarks*"
    delete_mode: contents
    max_depth: 6
