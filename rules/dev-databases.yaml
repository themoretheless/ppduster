      - $HOME/Library/Preferences/com.sequel-ace.sequel-ace.plist
      - $HOME/Library/Application Support/Sequel Ace
    delete_mode: path
    max_depth: 3

  - id: db-sequel-pro-legacy-residual-report
    name: Sequel Pro legacy residual (report-only)
