pack: dev-databases
rules:

  - id: db-azure-data-studio-caches
    name: Azure Data Studio caches and logs
    description: VS Code-fork Electron caches and logs for Azure Data Studio.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/azuredatastudio/Cache
      - $HOME/Library/Application Support/azuredatastudio/CachedData
      - $HOME/Library/Application Support/azuredatastudio/Code Cache
      - $HOME/Library/Application Support/azuredatastudio/GPUCache
      - $HOME/Library/Application Support/azuredatastudio/CachedExtensions
      - $HOME/Library/Application Support/azuredatastudio/CachedExtensionVSIXs
      - $HOME/Library/Application Support/azuredatastudio/logs
      - $HOME/Library/Application Support/azuredatastudio/Crashpad
      - $HOME/Library/Caches/com.azuredatastudio.oss
      - $HOME/Library/Caches/com.microsoft.azuredatastudio
    delete_mode: contents
    max_depth: 5

  - id: db-azure-data-studio-residual-report
    name: Azure Data Studio residual (report-only)
    description: Full azuredatastudio Application Support residual including User profiles.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/azuredatastudio
      - $HOME/Library/Preferences/com.azuredatastudio.oss.plist
      - $HOME/Library/Saved Application State/com.azuredatastudio.oss.savedState
    delete_mode: path
    max_depth: 3

  - id: db-beekeeper-caches
    name: Beekeeper Studio caches and logs
    description: Beekeeper Studio Electron caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/beekeeper-studio/Cache
      - $HOME/Library/Application Support/beekeeper-studio/Code Cache
      - $HOME/Library/Application Support/beekeeper-studio/GPUCache
      - $HOME/Library/Application Support/beekeeper-studio/logs
    delete_mode: contents
    max_depth: 4

  - id: db-beekeeper-residual-report
    name: Beekeeper Studio residual (report-only)
    description: Full Beekeeper Studio support residual with connection store.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/beekeeper-studio
      - $HOME/Library/Preferences/io.beekeeperstudio.desktop.plist
      - $HOME/Library/Saved Application State/io.beekeeperstudio.desktop.savedState
    delete_mode: path
    max_depth: 3

  - id: db-cassandra-devcenter-report
    name: Cassandra DevCenter residual (report-only)
    description: DataStax DevCenter workspace and prefs residual.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.devcenter
      - $HOME/Library/Application Support/DevCenter
      - $HOME/Library/Application Support/DataStax
      - $HOME/Library/Preferences/com.datastax.devcenter.plist
      - $HOME/Library/Caches/com.datastax.devcenter
    delete_mode: path
    max_depth: 4

  - id: db-cli-history-report
    name: SQL/Redis CLI history files (report-only)
    description: mysql, psql, sqlite, litecli, mycli, redis-cli interactive histories.
    category: privacy
    platform: any
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.mysql_history
      - $HOME/.psql_history
      - $HOME/.sqlite_history
      - $HOME/.litecli-history
      - $HOME/.mycli-history
      - $HOME/.rediscli_history
      - $HOME/.python_history
      - $HOME/.config/litecli
      - $HOME/.config/mycli
      - $HOME/.config/pgcli
    delete_mode: path
    max_depth: 3

  - id: db-datagrip-residual-report
    name: DataGrip config residual (report-only)
    description: DataGrip Application Support config trees left after uninstall (data sources, options).
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/JetBrains
    include_globs:
      - "**/DataGrip*/**"
    delete_mode: path
    max_depth: 4

  - id: db-dbeaver-drivers-cache
    name: DBeaver downloaded drivers cache
    description: Auto-downloaded JDBC drivers under DBeaverData/drivers; re-fetched on demand.
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/Library/DBeaverData/drivers
      - $HOME/Library/Application Support/DBeaverData/drivers
    delete_mode: contents
    max_depth: 5

  - id: db-dbeaver-workspace-logs
    name: DBeaver workspace and Eclipse logs
    description: Workspace .metadata logs and install-data runtime leftovers.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/DBeaverData
      - $HOME/Library/Application Support/DBeaverData
      - $HOME/Library/Caches/dbeaver
      - $HOME/Library/Logs/DBeaver
    include_globs:
      - "**/.metadata/.log"
      - "**/.metadata/.plugins/**/*.log"
      - "**/logs/**"
      - "**/*.log"
      - "**/install-data/**"
    delete_mode: contents
    max_depth: 8

  - id: db-dbeaver-workspace-report
    name: DBeaver workspace and secure store (report-only)
    description: Full DBeaverData workspace residual including connections and encrypted credentials.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/DBeaverData
      - $HOME/Library/Application Support/DBeaverData
      - $HOME/.dbeaver4
      - $HOME/.dbeaver
    delete_mode: path
    max_depth: 3

  - id: db-docker-volumes-report
    name: Docker Desktop volume and VM disk store (report-only)
    description: Host paths backing Docker volumes and the Docker.raw sparse disk (all images/volumes).
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Containers/com.docker.docker/Data/docker.raw
      - $HOME/.docker/volumes
    delete_mode: path
    max_depth: 3

  - id: db-elasticsearch-data-report
    name: Elasticsearch local data dirs (report-only)
    description: Homebrew Elasticsearch/OpenSearch index data directories.
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - /opt/homebrew/var/lib/elasticsearch
      - /opt/homebrew/var/elasticsearch
      - /opt/homebrew/var/lib/opensearch
      - $HOME/Library/Application Support/Elastic
    delete_mode: path
    max_depth: 4

  - id: db-elasticsearch-logs
    name: Elasticsearch local logs
    description: Homebrew and common local Elasticsearch/OpenSearch log directories.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - /opt/homebrew/var/log/elasticsearch
      - /opt/homebrew/var/log/opensearch
      - $HOME/Library/Logs/Elasticsearch
      - $HOME/Library/Logs/elasticsearch
      - $HOME/Library/Logs/opensearch
    delete_mode: contents
    max_depth: 4

  - id: db-homebrew-mysql-mongo-logs
    name: Homebrew MySQL/MariaDB/MongoDB logs
    description: Error/slow query logs for brew MySQL family and MongoDB.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - /opt/homebrew/var/mysql
      - /opt/homebrew/var/log
      - /opt/homebrew/var/log/mongodb
      - $HOME/Library/Logs/MySQL
      - $HOME/Library/Logs/mongodb
    include_globs:
      - "**/*.err"
      - "**/mysql-*.log"
      - "**/mariadb*.log"
      - "**/slow_query.log"
      - "**/mongod.log"
      - "**/mongod.log.*"
    delete_mode: contents
    max_depth: 3

  - id: db-homebrew-postgres-logs
    name: Homebrew PostgreSQL logs
    description: "postgresql@N brew formula log directories."
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - /opt/homebrew/var/log
    include_globs:
      - "**/postgresql@*/*"
      - "**/postgres*.log"
      - "**/postgresql.log"
    delete_mode: contents
    max_depth: 4

  - id: db-homebrew-server-data-report
    name: Homebrew DB server data dirs (report-only)
    description: "postgresql@N, mysql, mariadb, mongodb-community data under Homebrew var."
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - "/opt/homebrew/var/postgresql@14"
      - "/opt/homebrew/var/postgresql@15"
      - "/opt/homebrew/var/postgresql@16"
      - "/opt/homebrew/var/postgresql@17"
      - "/opt/homebrew/var/postgresql@18"
      - /opt/homebrew/var/postgres
      - /opt/homebrew/var/mysql
      - /opt/homebrew/var/mariadb
      - /opt/homebrew/var/mongodb
    delete_mode: path
    max_depth: 3

  - id: db-mongodb-compass-caches
    name: MongoDB Compass Electron caches and logs
    description: Compass Cache/Code Cache/GPUCache/logs (not connection favorities).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/MongoDB Compass/Cache
      - $HOME/Library/Application Support/MongoDB Compass/Code Cache
      - $HOME/Library/Application Support/MongoDB Compass/GPUCache
      - $HOME/Library/Application Support/MongoDB Compass/logs
      - $HOME/Library/Application Support/MongoDB Compass/blob_storage
      - $HOME/Library/Logs/MongoDB Compass
    delete_mode: contents
    max_depth: 4

  - id: db-mongodb-compass-residual-report
    name: MongoDB Compass residual (report-only)
    description: Full Compass Application Support residual (connections, local storage).
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/MongoDB Compass
      - $HOME/Library/Application Support/MongoDB Compass Community Edition
      - $HOME/Library/Preferences/com.mongodb.compass.plist
      - $HOME/Library/Saved Application State/com.mongodb.compass.savedState
    delete_mode: path
    max_depth: 3

  - id: db-mysql-workbench-data-report
    name: MySQL Workbench config residual (report-only)
    description: Full Workbench Application Support tree with connections and models.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/MySQL/Workbench
      - $HOME/Library/Application Support/MySQL
      - $HOME/Library/Preferences/com.oracle.workbench.MySQLWorkbench.plist
    delete_mode: path
    max_depth: 4

  - id: db-mysql-workbench-logs-cache
    name: MySQL Workbench logs and cache
    description: Workbench log directory and regenerable cache under Application Support.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/MySQL/Workbench/log
      - $HOME/Library/Application Support/MySQL/Workbench/cache
      - $HOME/Library/Application Support/Workbench/log
      - $HOME/Library/Caches/com.oracle.workbench.MySQLWorkbench
      - $HOME/Library/Logs/MySQLWorkbench
    delete_mode: contents
    max_depth: 4

  - id: db-neo4j-desktop-caches-logs
    name: Neo4j Desktop caches and logs
    description: Neo4j Desktop Electron/app caches and instance logs outside graph data.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Neo4j Desktop/Cache
      - $HOME/Library/Application Support/Neo4j Desktop/Code Cache
      - $HOME/Library/Application Support/Neo4j Desktop/GPUCache
      - $HOME/Library/Application Support/Neo4j Desktop/logs
      - $HOME/Library/Application Support/neo4j-desktop/Cache
      - $HOME/Library/Application Support/neo4j-desktop/logs
      - $HOME/Library/Caches/com.neo4j.neo4j-desktop
      - $HOME/Library/Logs/Neo4j Desktop
    delete_mode: contents
    max_depth: 5

  - id: db-neo4j-desktop-data-report
    name: Neo4j Desktop data directories (report-only)
    description: Neo4j Desktop projects, DBMS installs, and graph store data.
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/Neo4j Desktop
      - $HOME/Library/Application Support/neo4j-desktop
      - $HOME/Library/Application Support/neo4j-desktop/Application
      - $HOME/Library/Application Support/Neo4j Desktop/Application
      - $HOME/.neo4j
    delete_mode: path
    max_depth: 4

  - id: db-pgadmin-cache-logs
    name: pgAdmin 4 cache and logs
    description: pgAdmin desktop session cache, log files, and Electron-style app caches.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/.pgadmin
      - $HOME/Library/Application Support/pgAdmin 4
      - $HOME/Library/Caches/pgAdmin 4
      - $HOME/Library/Caches/net.pgadmin.pgadmin4
      - $HOME/Library/Logs/pgAdmin 4
    include_globs:
      - "**/*.log"
      - "**/pgadmin4.log"
      - "**/Cache/**"
      - "**/Code Cache/**"
      - "**/GPUCache/**"
      - "**/logs/**"
      - "**/Sessions/**"
      - "**/blob_storage/**"
    delete_mode: contents
    max_depth: 5

  - id: db-pgadmin-config-report
    name: pgAdmin 4 config and server store (report-only)
    description: pgadmin4.db and full Application Support tree holding saved servers.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/.pgadmin
      - $HOME/Library/Application Support/pgAdmin 4
    delete_mode: path
    max_depth: 3

  - id: db-pgcli-mycli-cache
    name: pgcli/mycli/litecli caches
    description: Completer caches and log files for enhanced SQL CLIs.
    category: app-cache
    platform: any
    risk: report-only
    default_enabled: false
    min_age_days: 21
    paths:
      - $HOME/.cache/pgcli
      - $HOME/.cache/mycli
      - $HOME/.cache/litecli
      - $HOME/Library/Caches/pgcli
      - $HOME/Library/Caches/mycli
      - $HOME/Library/Caches/litecli
    delete_mode: contents
    max_depth: 3

  - id: db-postgresapp-data-report
    name: Postgres.app data directories (report-only)
    description: Default Postgres.app cluster data dirs (var-XX). Live databases; inventory only.
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/Postgres
    delete_mode: path
    max_depth: 3

  - id: db-postgresapp-logs
    name: Postgres.app server logs
    description: PostgreSQL log files under Postgres.app cluster var directories (not the data files themselves).
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Postgres
    include_globs:
      - "**/log/**"
      - "**/pg_log/**"
      - "**/*.log"
      - "**/postgresql-*.log"
      - "**/postgresql-*.csv"
    delete_mode: contents
    max_depth: 6

  - id: db-postgresapp-prefs-residual-report
    name: Postgres.app preferences residual (report-only)
    description: User defaults and leftover support after uninstall.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Preferences/com.postgresapp.Postgres2.plist
      - $HOME/Library/Preferences/com.postgresapp.Postgres.plist
      - $HOME/Library/Saved Application State/com.postgresapp.Postgres2.savedState
      - $HOME/Library/Caches/com.postgresapp.Postgres2
    delete_mode: path
    max_depth: 2

  - id: db-postico-caches-logs
    name: Postico caches and logs
    description: Postico / Postico 2 caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/at.eggerapps.Postico
      - $HOME/Library/Caches/at.eggerapps.Postico2
      - $HOME/Library/Logs/Postico
      - $HOME/Library/Logs/Postico 2
      - $HOME/Library/Containers/at.eggerapps.Postico/Data/Library/Caches
      - $HOME/Library/Containers/at.eggerapps.Postico2/Data/Library/Caches
    delete_mode: contents
    max_depth: 5

  - id: db-postico-residual-report
    name: Postico residual (report-only)
    description: Postico containers and prefs residual after uninstall.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Containers/at.eggerapps.Postico
      - $HOME/Library/Containers/at.eggerapps.Postico2
      - $HOME/Library/Application Support/Postico
      - $HOME/Library/Application Support/Postico 2
      - $HOME/Library/Preferences/at.eggerapps.Postico.plist
      - $HOME/Library/Preferences/at.eggerapps.Postico2.plist
      - "$HOME/Library/Group Containers/*.at.eggerapps.Postico"
    delete_mode: path
    max_depth: 3

  - id: db-redis-dump-report
    name: Redis RDB dumps (report-only)
    description: dump.rdb and appendonly persistence files in common local locations.
    category: db-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/dump.rdb
      - $HOME/appendonly.aof
      - /opt/homebrew/var/db/redis
      - /opt/homebrew/var/redis
      - $HOME/Library/Application Support/redis
    include_globs:
      - "**/dump.rdb"
      - "**/appendonly.aof"
      - "**/appendonly.aof.*"
    delete_mode: path
    max_depth: 4

  - id: db-redisinsight-caches
    name: RedisInsight Electron caches and logs
    description: RedisInsight / Redis Insight UI caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/RedisInsight/Cache
      - $HOME/Library/Application Support/RedisInsight/Code Cache
      - $HOME/Library/Application Support/RedisInsight/GPUCache
      - $HOME/Library/Application Support/RedisInsight/logs
      - $HOME/Library/Application Support/RedisInsight-v2/Cache
      - $HOME/Library/Application Support/RedisInsight-v2/Code Cache
      - $HOME/Library/Application Support/RedisInsight-v2/GPUCache
      - $HOME/Library/Application Support/RedisInsight-v2/logs
      - $HOME/Library/Application Support/redisinsight/logs
      - $HOME/Library/Caches/org.redis.RedisInsight
      - $HOME/Library/Caches/com.electron.redisinsight
    delete_mode: contents
    max_depth: 4

  - id: db-redisinsight-residual-report
    name: RedisInsight residual (report-only)
    description: Full RedisInsight support tree residual with saved databases.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Application Support/RedisInsight
      - $HOME/Library/Application Support/RedisInsight-v2
      - $HOME/Library/Application Support/redisinsight
      - $HOME/Library/Preferences/org.redis.RedisInsight.plist
