pack: macos-containers
rules:

  - id: alacritty-kitty-caches-logs
    name: Alacritty and Kitty caches and logs
    description: GPU terminal emulator residual caches/logs. Not config files.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/org.alacritty
      - $HOME/Library/Caches/alacritty
      - $HOME/Library/Logs/alacritty
      - $HOME/Library/Caches/net.kovidgoyal.kitty
      - $HOME/Library/Caches/kitty
      - $HOME/Library/Logs/kitty
      - $HOME/Library/Saved Application State/org.alacritty.savedState
      - $HOME/Library/Saved Application State/net.kovidgoyal.kitty.savedState
    delete_mode: contents
    max_depth: 5

  - id: apple-archiveutility-residual
    name: Archive Utility residual caches and ops
    description: Archive Utility container Caches/Logs/tmp and PKSigned unarchive operations temp.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 3
    paths:
      - $HOME/Library/Containers/com.apple.archiveutility/Data/Library/Caches
      - $HOME/Library/Containers/com.apple.archiveutility/Data/Library/Logs
      - $HOME/Library/Containers/com.apple.archiveutility/Data/tmp
