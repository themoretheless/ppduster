pack: macos
rules:
  - id: macos-user-caches
    name: User Library Caches
    description: Non-essential app caches under ~/Library/Caches (excludes some Apple services).
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 3
    paths:
      - "$HOME/Library/Caches"
    exclude_globs:
      - "CloudKit"
      - "CloudKit/**"
      - "com.apple.Safari"
      - "com.apple.Safari/**"
      - "com.apple.HomeKit"
      - "com.apple.HomeKit/**"
      - "FamilyCircle"
      - "FamilyCircle/**"
      - "com.apple.findmy*"
      - "com.apple.findmy*/**"
      - "JetBrains"
      - "JetBrains/**"
      - "Google"
      - "Google/**"
      - "Firefox"
      - "Firefox/**"
      - "Homebrew"
      - "Homebrew/**"
    delete_mode: contents
    max_depth: 6

  - id: macos-user-logs
    name: User Library Logs
    description: Application log files in ~/Library/Logs.
    category: logs
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Logs"
    exclude_globs:
      - "Homebrew"
      - "Homebrew/**"
    delete_mode: contents
    max_depth: 8

  - id: macos-saved-state
    name: Saved Application State
    description: Window restoration state; safe to remove, apps recreate it.
    category: leftovers
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Saved Application State"
    delete_mode: contents
    max_depth: 4

  - id: macos-tmp
    name: User temp (TMPDIR)
    description: Files in the user temporary directory older than min age.
    category: temp
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 2
    paths:
      - "$TMPDIR"
    delete_mode: contents
    max_depth: 4

  - id: macos-ios-device-support
    name: iOS Device Support (Xcode)
    description: Old device symbols; large and regenerable via Xcode.
    category: dev
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 30
    paths:
      - "$HOME/Library/Developer/Xcode/iOS DeviceSupport"
    delete_mode: contents
    max_depth: 3

  - id: macos-xcode-derived-data
    name: Xcode DerivedData
    description: Build intermediates; will force full rebuilds.
    category: dev
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 7
    paths:
      - "$HOME/Library/Developer/Xcode/DerivedData"
    delete_mode: contents
    max_depth: 2

  - id: macos-xcode-archives
    name: Xcode Archives
    description: "Report-only archives may be needed for App Store or dSYM."
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 90
    paths:
      - "$HOME/Library/Developer/Xcode/Archives"
    delete_mode: contents
    max_depth: 3

  - id: macos-homebrew-cache
    name: Homebrew downloads cache
    description: Cached bottles and source downloads.
    category: package-cache
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Caches/Homebrew"
    delete_mode: contents
    max_depth: 6

  - id: macos-homebrew-logs
    name: Homebrew logs
    description: Build and install logs left by Homebrew under the user Library.
    category: logs
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Logs/Homebrew"
    delete_mode: contents
    max_depth: 5

  - id: macos-homebrew-downloads-report
    name: Homebrew Downloads folder (report-only)
    description: User-kept bottle/pkg/dmg downloads may be removable, but review before deleting.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 14
    paths:
      - "$HOME/Downloads"
    include_globs:
      - "Homebrew/*.tar.gz"
      - "Homebrew/*.zip"
      - "Homebrew/*.pkg"
      - "Homebrew/*.dmg"
      - "brew-*.tar.gz"
      - "brew-*.zip"
      - "brew-*.pkg"
      - "brew-*.dmg"
    delete_mode: contents
    max_depth: 2

  - id: macos-quicklook-cache
    name: Quick Look thumbnails cache
    description: qlmanage thumbnail cache if present.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Caches/com.apple.QuickLook.thumbnailcache"
      - "$HOME/Library/Caches/CloudKit/com.apple.QuickLook.thumbnailcache"
    delete_mode: path
    max_depth: 2

  - id: macos-crash-reports-user
    name: User crash and diagnostic reports
    description: Per-user crash logs and diagnostic reports that apps regenerate.
    category: logs
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Logs/CrashReporter"
      - "$HOME/Library/Logs/DiagnosticReports"
    delete_mode: contents

  - id: macos-safari-favicon-cache
    name: Safari favicon cache
    description: Safari website icon cache; safe to rebuild.
    category: browser-cache
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Safari/Favicon Cache"
    delete_mode: contents

  - id: macos-safari-preview-cache
    name: Safari webpage preview cache
    description: Safari previews and touch icon cache files.
    category: browser-cache
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Safari"
    include_globs:
      - "**/Webpage Previews/**"
      - "**/Touch Icons Cache/**"
    delete_mode: contents
    max_depth: 4

  - id: macos-firefox-profile-caches
    name: Firefox profile caches
    description: Firefox cache2, startup cache, and jump-list cache under user profiles.
    category: browser-cache
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Caches/Firefox/Profiles"
    include_globs:
      - "*/cache2/**"
      - "*/startupCache/**"
      - "*/jumpListCache/**"
    delete_mode: contents
    max_depth: 4

  - id: macos-chromium-code-caches
    name: Chromium-family code and GPU caches
    description: Per-profile regenerable browser caches such as Code Cache, GPUCache, and Dawn/Shader caches.
    category: browser-cache
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 7
    paths:
      - "$HOME/Library/Application Support/Google/Chrome"
      - "$HOME/Library/Application Support/Chromium"
      - "$HOME/Library/Application Support/BraveSoftware/Brave-Browser"
      - "$HOME/Library/Application Support/Microsoft Edge"
      - "$HOME/Library/Application Support/Vivaldi"
      - "$HOME/Library/Application Support/Arc"
    include_globs:
      - "**/Code Cache/**"
      - "**/GPUCache/**"
      - "**/DawnCache/**"
      - "**/GrShaderCache/**"
      - "**/GraphiteDawnCache/**"
      - "**/ShaderCache/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-core-simulator-caches
    name: CoreSimulator caches and logs
    description: Simulator caches and logs outside device data; safe but can slow next simulator launch.
    category: dev
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 14
    paths:
      - "$HOME/Library/Developer/CoreSimulator/Caches"
      - "$HOME/Library/Developer/CoreSimulator/Logs"
    delete_mode: contents

  - id: macos-mail-downloads
    name: Mail Downloads
    description: Attachments saved by Mail.app; medium risk.
    category: leftovers
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 30
    paths:
      - "$HOME/Library/Containers/com.apple.mail/Data/Library/Mail Downloads"
    delete_mode: contents
    max_depth: 4

  - id: macos-ds-store-home-library
    name: .DS_Store under Library Caches/Logs only
    description: Finder metadata files limited to known junk trees (not full home walk).
    category: leftovers
    platform: macos
    risk: low
    default_enabled: false
    min_age_days: 1
    paths:
      - "$HOME/Library/Caches"
      - "$HOME/Library/Logs"
    include_globs:
      - "**/.DS_Store"
    delete_mode: contents
    max_depth: 10

  - id: macos-ios-backups-report
    name: iOS backups (report-only)
    description: Device backups under MobileSync; never auto-delete.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - "$HOME/Library/Application Support/MobileSync/Backup"
    delete_mode: path
    max_depth: 2

  - id: macos-updater-caches
    name: App updater download caches
    description: Old updater downloads for various apps (ShipIt, cron, etc.).
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Caches/com.microsoft.VSCode.ShipIt"
      - "$HOME/Library/Caches/com.microsoft.VSCodeInsiders.ShipIt"
      - "$HOME/Library/Caches/cron-updater"
      - "$HOME/Library/Caches/com.todesktop.210203cqatirggu"
    delete_mode: contents
    max_depth: 4

  - id: macos-jetbrains-app-support-caches
    name: JetBrains IDE Application Support caches
    description: Per-IDE index, caches and logs under Application Support/JetBrains (separate from Library/Caches).
    category: dev
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 21
    paths:
      - "$HOME/Library/Application Support/JetBrains"
    include_globs:
      - "*/log/**"
      - "*/logs/**"
    delete_mode: contents
    max_depth: 5

  - id: macos-jetbrains-old-versions
    name: JetBrains old IDE versions (report-only)
    description: Previous major versions of JetBrains IDEs under Application Support; review before deleting.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 60
    paths:
      - "$HOME/Library/Application Support/JetBrains"
    delete_mode: path
    max_depth: 1

  - id: macos-codex-runtimes-cache
    name: Codex runtimes cache
    description: OpenAI Codex downloaded language runtimes under ~/.cache/codex-runtimes.
    category: dev
    platform: macos
    risk: medium
    default_enabled: false
    min_age_days: 30
    paths:
      - "$HOME/.cache/codex-runtimes"
    delete_mode: contents
    max_depth: 4

  - id: macos-imazing-cache
    name: iMazing emoji cache
    description: iMazing downloaded emoji assets; safe to remove.
    category: app-cache
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 30
    paths:
      - "$HOME/Library/Application Support/iMazing/Emojis"
    delete_mode: contents
    max_depth: 3

  - id: macos-fontd-cache
    name: Font daemon cache
    description: macOS font rendering caches; rebuilt automatically.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Caches/com.apple.FontRegistry.user"
    delete_mode: contents
    max_depth: 3

  - id: macos-metal-cache
    name: Metal shader cache
    description: macOS Metal pre-compiled shader cache; safe to remove.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 14
    paths:
      - "$HOME/Library/Caches/com.apple.metal"
    delete_mode: contents
    max_depth: 4

  - id: macos-helpd-cache
    name: Help daemon cache
    description: macOS Help Viewer content cache.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 30
    paths:
      - "$HOME/Library/Caches/com.apple.helpd"
    delete_mode: contents
    max_depth: 4

  - id: macos-geoservices-cache
    name: GeoServices cache
    description: Maps and location services tile cache.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 30
    paths:
      - "$HOME/Library/Caches/GeoServices"
    delete_mode: contents
    max_depth: 5

  - id: macos-nsurl-session-cache
    name: NSURLSession daemon cache
    description: Background URL session download cache files.
    category: caches
    platform: macos
    risk: low
    default_enabled: true
    min_age_days: 7
    paths:
      - "$HOME/Library/Caches/com.apple.nsurlsessiond"
    delete_mode: contents
    max_depth: 4

  - id: macos-simulator-old-devices-report
    name: CoreSimulator old devices (report-only)
    description: Old simulator device images; review before deleting.
    category: dev
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 60
    paths:
      - "$HOME/Library/Developer/CoreSimulator/Devices"
    delete_mode: path
    max_depth: 1
