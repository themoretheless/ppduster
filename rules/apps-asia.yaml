pack: apps-asia
rules:

  - id: asia-aliyun-adrive-electron
    name: Alibaba aDrive Electron caches
    description: 阿里云盘 aDrive (com.alicloud.smartdrive) Electron cache leaves under Application Support/aDrive.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/aDrive/Cache
      - $HOME/Library/Application Support/aDrive/Code Cache
      - $HOME/Library/Application Support/aDrive/GPUCache
      - $HOME/Library/Application Support/aDrive/DawnGraphiteCache
      - $HOME/Library/Application Support/aDrive/DawnWebGPUCache
      - $HOME/Library/Application Support/aDrive/Service Worker
      - $HOME/Library/Application Support/aDrive/blob_storage
      - $HOME/Library/Application Support/aDrive/Crashpad
      - $HOME/Library/Application Support/aDrive/logs
      - $HOME/Library/Caches/com.alicloud.smartdrive
      - $HOME/Library/Caches/aDrive
      - $HOME/Library/Logs/aDrive
      - $HOME/Library/Logs/com.alicloud.smartdrive
    exclude_globs:
      - "**/Local Storage/**"
      - "**/IndexedDB/**"
      - "**/Cookies/**"
    delete_mode: contents
    max_depth: 6

