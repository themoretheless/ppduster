    max_depth: 5

  - id: cad-prusaslicer-cache
    name: PrusaSlicer vendor/index cache
    description: PrusaSlicer cache directory (vendor indices, locks, downloads) under Application Support.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/PrusaSlicer/cache
      - $HOME/Library/Application Support/PrusaSlicer-alpha/cache
      - $HOME/Library/Application Support/PrusaSlicer-beta/cache
      - $HOME/Library/Caches/com.prusa3d.slic3r
