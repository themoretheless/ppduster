pack: apps-cad-print
rules:

  - id: cad-autocad-caches
    name: AutoCAD for Mac caches
    description: AutoCAD NSCache and Autodesk AutoCAD local cache trees.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.autodesk.AutoCAD
      - $HOME/Library/Caches/com.autodesk.AutoCADLT
      - $HOME/Library/Caches/Autodesk/AutoCAD
      - $HOME/Library/Application Support/Autodesk/Local/AutoCAD
      - $HOME/Library/Application Support/Autodesk/Local/AutoCAD LT
    delete_mode: contents
    max_depth: 6

  - id: cad-autocad-logs
    name: AutoCAD for Mac logs
    description: AutoCAD crash and session logs under Autodesk logs.
    category: app-logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Logs/Autodesk/AutoCAD
      - $HOME/Library/Application Support/Autodesk/AutoCAD 2024/R24.3/logs
      - $HOME/Library/Application Support/Autodesk/AutoCAD 2025/R25.0/logs
      - $HOME/Library/Application Support/Autodesk/AutoCAD 2026/R26.0/logs
    delete_mode: contents
    max_depth: 5

  - id: cad-bambu-studio-cache
    name: Bambu Studio cache
    description: Bambu Studio (PrusaSlicer fork) cache and NSCache.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/BambuStudio/cache
      - $HOME/Library/Application Support/BambuStudio/log
      - $HOME/Library/Application Support/BambuStudio/logs
      - $HOME/Library/Caches/BambuStudio
      - $HOME/Library/Caches/com.bambulab.bambu-studio
      - $HOME/Library/Caches/com.bambulab.BambuStudio
      - $HOME/Library/Logs/BambuStudio
    delete_mode: contents
    max_depth: 5

  - id: cad-blender-residual-caches
    name: Blender residual version caches (extra)
    description: Blender versioned cache dirs not fully covered by creative-blender rule (5.x and Foundation alternate layout) plus asset index cache.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Blender/3.6/cache
      - $HOME/Library/Application Support/Blender/4.0/cache
      - $HOME/Library/Application Support/Blender/4.1/cache
      - $HOME/Library/Application Support/Blender/4.2/cache
      - $HOME/Library/Application Support/Blender/4.3/cache
      - $HOME/Library/Application Support/Blender/4.4/cache
      - $HOME/Library/Application Support/Blender/4.5/cache
      - $HOME/Library/Application Support/Blender/5.0/cache
      - $HOME/Library/Application Support/Blender/5.1/cache
      - $HOME/Library/Application Support/Blender/5.2/cache
      - $HOME/Library/Caches/Blender
    delete_mode: contents
    max_depth: 5

  - id: cad-blender-temp-logs
    name: Blender temp and crash logs residual
    description: Blender crash logs under temp and Application Support log leftovers.
    category: temp
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 3
    paths:
      - $HOME/Library/Application Support/Blender/5.0/logs
      - $HOME/Library/Application Support/Blender/5.1/logs
      - $HOME/Library/Application Support/Blender/5.2/logs
      - $HOME/Library/Logs/Blender
      - $TMPDIR/blender
      - $HOME/Library/Application Support/Blender Foundation/Blender/Temp
    delete_mode: contents
    max_depth: 4

  - id: cad-chitubox-cache
    name: ChiTuBox cache, dumps, logs
    description: CHITUBOX Basic/Pro Application Support cache, crash dumps, and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/CHITUBOX
      - $HOME/Library/Application Support/chitubox
      - $HOME/Library/Application Support/chitubox2_0
      - $HOME/Library/Application Support/CHITUBOXBasic
      - $HOME/Library/Application Support/CHITUBOXPro
      - $HOME/Library/Caches/CHITUBOX
      - $HOME/Library/Caches/com.chitubox.slicer
      - $HOME/Library/Logs/CHITUBOX
      - $HOME/Library/Logs/chitubox
    delete_mode: contents
    max_depth: 6

  - id: cad-cura-cache
    name: Ultimaker Cura cache
    description: Cura versioned cache (definitions cache, HTTP) under Application Support/cura.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/cura
      - $HOME/Library/Application Support/Cura
      - $HOME/Library/Caches/cura
      - $HOME/Library/Caches/Cura
      - $HOME/Library/Caches/Ultimaker B.V.
      - $HOME/Library/Caches/nl.ultimaker.cura
    delete_mode: contents
    max_depth: 6

  - id: cad-cura-logs
    name: Ultimaker Cura logs
    description: cura.log and related Ultimaker Cura logs.
    category: app-logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Logs/cura
      - $HOME/Library/Logs/Cura
      - $HOME/Library/Logs/Ultimaker
      - $HOME/Library/Application Support/cura/log
      - $HOME/Library/Application Support/Cura/log
    delete_mode: contents
    max_depth: 4

  - id: cad-edrawings-caches
    name: SolidWorks eDrawings caches and logs
    description: eDrawings for Mac viewer caches/logs (not SolidWorks part libraries).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.solidworks.eDrawings
      - $HOME/Library/Caches/com.solidworks.edrawings
      - $HOME/Library/Application Support/eDrawings/Cache
      - $HOME/Library/Application Support/SolidWorks/eDrawings/Cache
      - $HOME/Library/Logs/eDrawings
      - $HOME/Library/Logs/SolidWorks/eDrawings
    delete_mode: contents
    max_depth: 5

  - id: cad-freecad-log-file
    name: FreeCAD main log file
    description: Primary FreeCAD.log written under Application Support/FreeCAD.
    category: app-logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 3
    paths:
      - $HOME/Library/Application Support/FreeCAD
    delete_mode: contents
    max_depth: 2

  - id: cad-freecad-logs-cache
    name: FreeCAD logs and cache
    description: FreeCAD.log and Cache directory under Application Support; optional Caches bundle IDs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/FreeCAD/Cache
      - $HOME/Library/Application Support/FreeCAD/__pycache__
      - $HOME/Library/Caches/FreeCAD
      - $HOME/Library/Caches/org.freecadweb.FreeCAD
      - $HOME/Library/Caches/org.freecad.FreeCAD
      - $HOME/Library/Logs/FreeCAD
    delete_mode: contents
    max_depth: 5

  - id: cad-fusion-cip-telemetry
    name: Autodesk Fusion CIP / telemetry caches
    description: Customer Involvement Program and related Autodesk telemetry/temp under Application Support.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Autodesk/CIP
      - $HOME/Library/Application Support/Autodesk/ADPSDK/DLS
      - $HOME/Library/Application Support/Autodesk/ADPSDK/Logs
      - $HOME/Library/Application Support/Autodesk/Compute Platform
      - $HOME/Library/Application Support/Autodesk/Core
    delete_mode: contents
    max_depth: 6

  - id: cad-fusion-library-caches
    name: Autodesk Fusion Library/Caches
    description: Fusion 360 NSCache and related Autodesk Fusion cache bundles under ~/Library/Caches.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.autodesk.fusion360
      - $HOME/Library/Caches/com.autodesk.fusion
      - $HOME/Library/Caches/com.autodesk.Fusion360
      - $HOME/Library/Caches/Autodesk/Autodesk Fusion 360
      - $HOME/Library/Caches/Autodesk/Fusion 360
    delete_mode: contents
    max_depth: 6

  - id: cad-fusion-logs
    name: Autodesk Fusion logs
    description: Fusion installer/streamer and runtime logs under Library/Logs and Application Support.
    category: app-logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Logs/Autodesk/webdeploy
      - $HOME/Library/Application Support/Autodesk/webdeploy/logs
      - $HOME/Library/Application Support/Autodesk/Neutron Platform/Logs
      - $HOME/Library/Application Support/Autodesk/Autodesk Fusion 360/logs
    delete_mode: contents
    max_depth: 5

  - id: cad-fusion-neutron-temp
    name: Fusion Neutron Platform temp/cache
    description: Neutron Platform runtime temp and non-pref caches used by Fusion.
    category: temp
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Autodesk/Neutron Platform/Options
      - $HOME/Library/Application Support/Autodesk/Neutron/Server/Production/Cache
      - $HOME/Library/Application Support/Autodesk/Neutron/Server/Staging/Cache
    delete_mode: contents
    max_depth: 6

  - id: cad-fusion-offline-design-cache
    name: Fusion offline design cache (W.Login)
    description: "Locally cached Fusion cloud designs under Autodesk Fusion 360/<user-id>/W.Login. Regenerable from cloud; large re-download."
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - $HOME/Library/Application Support/Autodesk/Autodesk Fusion 360
    delete_mode: contents
    max_depth: 8

  - id: cad-grasshopper-temp
    name: Grasshopper temp and cache
    description: Grasshopper component temp/cache under McNeel Application Support.
    category: temp
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/McNeel/Rhinoceros/Grasshopper/Temp
      - $HOME/Library/Application Support/McNeel/Rhinoceros/Grasshopper/Cache
      - $HOME/Library/Application Support/Grasshopper/Temp
      - $HOME/Library/Application Support/Grasshopper/Cache
    delete_mode: contents
    max_depth: 6

  - id: cad-lychee-cache
    name: Lychee Slicer caches and logs
    description: Mango3D LycheeSlicer Application Support caches, Electron GPU/Code caches, and logs.
