      - $HOME/Library/Logs/MeshLab
    delete_mode: contents
    max_depth: 5

  - id: cad-meshmixer-caches
    name: Autodesk Meshmixer caches and logs
    description: Legacy Meshmixer Application Support temp/cache and NSCache (discontinued but still installed).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Autodesk/MeshmixerTemp
      - $HOME/Library/Application Support/Autodesk/Meshmixer
      - $HOME/Library/Caches/com.autodesk.meshmixer
      - $HOME/Library/Caches/Meshmixer
      - $HOME/Library/Logs/Meshmixer
      - $HOME/Library/Logs/Autodesk/Meshmixer
    delete_mode: contents
    max_depth: 5

  - id: cad-onshape-desktop-caches
    name: Onshape desktop / Electron caches
    description: Onshape desktop shell or App Store helper Chromium caches (browser primary; desktop residual).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.onshape.Onshape
      - $HOME/Library/Caches/com.onshape.mobile
      - $HOME/Library/Caches/Onshape
      - $HOME/Library/Application Support/Onshape/Cache
      - $HOME/Library/Application Support/Onshape/Code Cache
      - $HOME/Library/Application Support/Onshape/GPUCache
      - $HOME/Library/Application Support/Onshape/DawnCache
