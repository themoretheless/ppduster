    delete_mode: contents
    max_depth: 6

  - id: cad-open3d-cache
    name: Open3D dataset and cache
    description: Open3D downloaded example datasets and library caches.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
