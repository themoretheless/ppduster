      - $HOME/Library/Caches/com.mango3d.lycheeslicer
      - $HOME/Library/Logs/LycheeSlicer
    delete_mode: contents
    max_depth: 6

  - id: cad-meshlab-caches
    name: MeshLab caches and logs
    description: MeshLab / PyMeshLab NSCache and Application Support temp.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
