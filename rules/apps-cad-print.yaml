    max_depth: 6

  - id: cad-openscad-caches-backups
    name: OpenSCAD caches and auto-backups
    description: OpenSCAD Application Support backups and NSCache; geometry cache regenerates on compile.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
