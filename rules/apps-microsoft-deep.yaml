pack: apps-microsoft-deep
rules:

  - id: macos-ms-azuredatastudio-residual
    name: Azure Data Studio residual caches and logs
    description: Retired ADS Electron caches (VS Code fork). Cache/CachedData/logs/Crashpad only; not User/ connections.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/azuredatastudio/Cache
      - $HOME/Library/Application Support/azuredatastudio/CachedData
      - $HOME/Library/Application Support/azuredatastudio/CachedExtensions
      - $HOME/Library/Application Support/azuredatastudio/CachedExtensionVSIXs
      - $HOME/Library/Application Support/azuredatastudio/Code Cache
      - $HOME/Library/Application Support/azuredatastudio/GPUCache
      - $HOME/Library/Application Support/azuredatastudio/logs
      - $HOME/Library/Application Support/azuredatastudio/Crashpad
      - $HOME/Library/Application Support/azuredatastudio/blob_storage
      - $HOME/Library/Caches/com.azuredatastudio.oss
      - $HOME/Library/Caches/com.microsoft.azuredatastudio
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-company-portal-intune
    name: Company Portal / Intune residual caches and logs
    description: Intune Company Portal Mac caches, logs, SSO extension container caches, crashreporter data.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.microsoft.CompanyPortalMac
      - $HOME/Library/Caches/CompanyPortalCache
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.microsoft.CompanyPortalMac
      - $HOME/Library/Application Support/com.microsoft.CompanyPortalMac
      - $HOME/Library/Logs/Company Portal
      - $HOME/Library/HTTPStorages/com.microsoft.CompanyPortalMac
      - $HOME/Library/WebKit/com.microsoft.CompanyPortalMac
      - $HOME/Library/Containers/com.microsoft.CompanyPortalMac.ssoextension/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.CompanyPortalMac.ssoextension/Data/Library/Logs
      - $HOME/Library/Saved Application State/com.microsoft.CompanyPortalMac.savedState
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-defender-logs-diag
    name: Microsoft Defender for Endpoint diagnostic logs
    description: wdavdiag diagnostic zips and install.log; not quarantine or live product state.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Logs/Microsoft Defender
      - $HOME/Library/Logs/Microsoft/Defender
    delete_mode: contents
    max_depth: 4

  - id: macos-ms-edge-caches-deep
    name: Microsoft Edge deeper residual caches
    description: Edge stable/beta/dev/canary disk caches, WebKit, component/extension crx, Crashpad, optimization models.
    category: browser-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/Microsoft Edge
      - $HOME/Library/Caches/Microsoft Edge Beta
      - $HOME/Library/Caches/Microsoft Edge Canary
      - $HOME/Library/Caches/Microsoft Edge Dev
      - $HOME/Library/Application Support/Microsoft Edge/component_crx_cache
      - $HOME/Library/Application Support/Microsoft Edge/extensions_crx_cache
      - $HOME/Library/Application Support/Microsoft Edge/Crashpad
      - $HOME/Library/Application Support/Microsoft Edge/ShaderCache
      - $HOME/Library/Application Support/Microsoft Edge/GrShaderCache
      - $HOME/Library/Application Support/Microsoft Edge/GraphiteDawnCache
      - $HOME/Library/Application Support/Microsoft Edge/optimization_guide_model_store
      - $HOME/Library/Application Support/Microsoft Edge/OptimizationHints
      - $HOME/Library/Application Support/Microsoft Edge Beta/Crashpad
      - $HOME/Library/Application Support/Microsoft Edge WebView
    delete_mode: contents
    max_depth: 6

  - id: macos-ms-edgeupdater-residuals
    name: EdgeUpdater package cache and logs
    description: User EdgeUpdater versioned apps, crx_cache, updater logs (post-MAU Edge update mechanism).
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/crx_cache
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/apps
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/updater.log
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/updater.log.old
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/updater_history.jsonl
      - $HOME/Library/Application Support/Microsoft/EdgeUpdater/updater_history.jsonl.old
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-mau-autoupdate-deep
    name: Microsoft AutoUpdate (MAU) residual caches and clones
    description: User-level MAU caches, AU Daemon support, and common system MAU install tree (report paths under /Library for inventory).
    category: package-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/com.microsoft.autoupdate.fba
      - $HOME/Library/Caches/Microsoft/autoupdate
      - $HOME/Library/Application Support/Microsoft AU Daemon
      - $HOME/Library/HTTPStorages/com.microsoft.autoupdate2
      - $HOME/Library/Saved Application State/com.microsoft.autoupdate2.savedState
      - $HOME/Library/Logs/Microsoft AutoUpdate
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-office-container-caches-deep
    name: Office 365 residual container caches (Word Excel PPT Outlook OneNote)
    description: Per-app sandbox Library/Caches under Containers; not Data/Documents document trees or Outlook mail DB.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.microsoft.Office365ServiceV2/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.errorreporting/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.netlib.shipassertprocess/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.RMS-XPCService/Data/Library/Caches
    delete_mode: contents
    max_depth: 6

  - id: macos-ms-office-container-logs-temps
    name: Office container logs and Outlook temp
    description: Per-app Library/Logs and Outlook tmp under sandbox containers.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.microsoft.Word/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Excel/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Powerpoint/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Outlook/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Office365ServiceV2/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.errorreporting/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Outlook/Data/tmp
      - $HOME/Library/Containers/com.microsoft.Outlook/Data/tmp/Outlook Temp
      - $HOME/Library/Logs/Microsoft OneNote
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-office-group-font-solution-caches
    name: Office Group Container font and solution caches
    description: Cloud font cache and SolutionPackages under UBF8T346G9.Office; not Outlook profiles.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Group Containers/UBF8T346G9.Office/FontCache
      - $HOME/Library/Group Containers/UBF8T346G9.Office/SolutionPackages
      - $HOME/Library/Group Containers/UBF8T346G9.Office/User Content.localized/Startup.localized
      - $HOME/Library/Group Containers/UBF8T346G9.Office/OneNote/Cache
      - $HOME/Library/Caches/Microsoft/Office
      - $HOME/Library/Preferences/Microsoft/Office Font Cache
      - $HOME/Library/Preferences/Microsoft/Office 2008/Office Font Cache
      - $HOME/Library/Preferences/Microsoft/Office 2011/Office Font Cache
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-office-licensing-report
    name: Office licensing residual (report-only)
    description: Volume/retail license plists and licensing helper; activation-critical, never auto-delete.
    category: licensing
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Preferences/com.microsoft.office.licensingV2.plist
      - $HOME/Library/Group Containers/UBF8T346G9.Office/License Information
    delete_mode: path
    max_depth: 2

  - id: macos-ms-office-outlook-profile-report
    name: Outlook mail profile store (report-only)
    description: Outlook for Mac offline mail/attachment store under Group Containers; do not auto-delete.
    category: app-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Group Containers/UBF8T346G9.Office/Outlook
      - $HOME/Library/Group Containers/UBF8T346G9.Office/Outlook/Outlook 15 Profiles
    delete_mode: contents
    max_depth: 4

  - id: macos-ms-office-wef-osf-deep
    name: Office WEF / OsfWebHost / add-in residual caches
    description: Office JS web host and WEF package caches (regenerable; clears sideloaded add-ins).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Containers/com.microsoft.Outlook/Data/Documents/wef
      - $HOME/Library/Containers/com.microsoft.Word/Data/Library/Application Support/Microsoft/Office/16.0/Wef
      - $HOME/Library/Containers/com.microsoft.Excel/Data/Library/Application Support/Microsoft/Office/16.0/Wef
      - $HOME/Library/Containers/com.microsoft.Powerpoint/Data/Library/Application Support/Microsoft/Office/16.0/Wef
      - $HOME/Library/Containers/com.microsoft.Office365ServiceV2/Data/Caches/com.microsoft.Office365ServiceV2
      - $HOME/Library/Containers/com.microsoft.Office365ServiceV2/Data/Library/Caches/com.microsoft.Office365ServiceV2
      - $HOME/Library/Group Containers/UBF8T346G9.OfficeOsfWebHost
    delete_mode: contents
    max_depth: 6

  - id: macos-ms-oneauth-identity-caches
    name: Microsoft OneAuth / identity residual caches
    description: Shared Microsoft identity/oneauth group container caches used by Office/OneDrive/Teams sign-in.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - $HOME/Library/Group Containers/UBF8T346G9.com.microsoft.oneauth
      - $HOME/Library/Caches/com.microsoft.oneauth
      - $HOME/Library/HTTPStorages/com.microsoft.oneauth
    delete_mode: contents
    max_depth: 4

  - id: macos-ms-onedrive-group-sync-report
    name: OneDrive Group Container sync cache (report-only)
    description: Files On-Demand / standalone suite replica trees; may hold pinned offline copies.
    category: app-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Group Containers/UBF8T346G9.OneDriveStandaloneSuite
      - $HOME/Library/Group Containers/UBF8T346G9.OneDriveSyncClientSuite
      - $HOME/Library/Group Containers/UBF8T346G9.OfficeOneDriveSyncIntegration
    delete_mode: contents
    max_depth: 3

  - id: macos-ms-onedrive-residual-deep
    name: OneDrive deeper residual caches logs HTTPStorages
    description: OneDrive client caches, logs, FileProvider containers, updater caches; not CloudStorage sync content.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 5
    paths:
      - $HOME/Library/Caches/com.microsoft.OneDriveUpdater
      - $HOME/Library/Caches/OneDrive
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.microsoft.OneDrive
      - $HOME/Library/Caches/com.plausiblelabs.crashreporter.data/com.microsoft.OneDriveUpdater
      - $HOME/Library/Containers/com.microsoft.OneDrive.FileProvider/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.OneDrive.FileProvider/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.OneDrive.FinderSync/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.OneDriveLauncher/Data/Library/Caches
      - $HOME/Library/Application Support/OneDrive/logs
      - $HOME/Library/Application Support/OneDrive/cache
      - $HOME/Library/Application Support/com.microsoft.OneDrive
      - $HOME/Library/Application Support/com.microsoft.OneDriveUpdater
      - $HOME/Library/Application Support/OneDriveUpdater
      - $HOME/Library/Logs/Microsoft OneDrive
      - $HOME/Library/HTTPStorages/com.microsoft.OneDrive
      - $HOME/Library/HTTPStorages/com.microsoft.OneDriveStandaloneUpdater
      - $HOME/Library/WebKit/com.microsoft.OneDrive
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-powerbi-powerautomate-sharepoint-note
    name: Power BI / Power Automate / SharePoint native availability (report-only)
    description: No first-party Power BI Desktop or Power Automate Desktop residual trees on macOS; SharePoint sync is OneDrive.
    category: app-data
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 0
    paths:
      - $HOME/Library/Group Containers/UBF8T346G9.Office/SolutionPackages
    delete_mode: contents
    max_depth: 2

  - id: macos-ms-powershell-residual
    name: PowerShell residual logs and telemetry caches
    description: Cross-platform PowerShell module/telemetry caches and history-adjacent regenerable dirs under XDG-style paths; not user scripts.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/.cache/powershell
      - $HOME/.local/share/powershell/Telemetry
      - $HOME/.local/share/powershell/ModulesCache
      - $HOME/Library/Caches/powershell
      - $HOME/Library/Caches/com.microsoft.powershell
      - $HOME/Library/Logs/PowerShell
      - /var/log/powershell.log
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-shared-httpstorage-savedstate
    name: Shared Microsoft HTTPStorages and Saved Application State
    description: NSURL session HTTP storage and savedState leftovers for common Microsoft bundle IDs.
    category: leftovers
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/HTTPStorages/com.microsoft.Word
      - $HOME/Library/HTTPStorages/com.microsoft.Excel
      - $HOME/Library/HTTPStorages/com.microsoft.Powerpoint
      - $HOME/Library/HTTPStorages/com.microsoft.Outlook
      - $HOME/Library/HTTPStorages/com.microsoft.onenote.mac
      - $HOME/Library/HTTPStorages/com.microsoft.edgemac
      - $HOME/Library/HTTPStorages/com.microsoft.teams2
      - $HOME/Library/HTTPStorages/com.microsoft.VSCode
      - $HOME/Library/Saved Application State/com.microsoft.Word.savedState
      - $HOME/Library/Saved Application State/com.microsoft.Excel.savedState
      - $HOME/Library/Saved Application State/com.microsoft.Powerpoint.savedState
      - $HOME/Library/Saved Application State/com.microsoft.Outlook.savedState
      - $HOME/Library/Saved Application State/com.microsoft.edgemac.savedState
      - $HOME/Library/Saved Application State/com.microsoft.VSCode.savedState
      - $HOME/Library/Saved Application State/com.microsoft.rdc.macos.savedState
    delete_mode: contents
    max_depth: 3

  - id: macos-ms-skype-legacy-residual
    name: Skype for Desktop / Skype for Business residual
    description: Legacy Microsoft Skype Electron caches still found after Teams migration.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/Cache
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/Code Cache
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/GPUCache
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/Service Worker
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/blob_storage
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/logs
      - $HOME/Library/Application Support/Microsoft/Skype for Desktop/Crashpad
      - $HOME/Library/Logs/Skype Helper
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-teams-deep-residual
    name: Teams classic and Teams 2.x deeper residual
    description: Classic Electron under Application Support plus new Teams containers and group container caches/logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 5
    paths:
      - $HOME/Library/Application Support/Microsoft/Teams/Cache
      - $HOME/Library/Application Support/Microsoft/Teams/Code Cache
      - $HOME/Library/Application Support/Microsoft/Teams/GPUCache
      - $HOME/Library/Application Support/Microsoft/Teams/Application Cache/Cache
      - $HOME/Library/Application Support/Microsoft/Teams/blob_storage
      - $HOME/Library/Application Support/Microsoft/Teams/Service Worker
      - $HOME/Library/Application Support/Microsoft/Teams/logs
      - $HOME/Library/Application Support/Microsoft/Teams/tmp
      - $HOME/Library/Application Support/Microsoft/Teams/DawnGraphiteCache
      - $HOME/Library/Application Support/Microsoft/Teams/DawnWebGPUCache
      - $HOME/Library/Logs/Microsoft Teams
      - $HOME/Library/Containers/com.microsoft.teams2.launcher/Data/Library/Caches
      - $HOME/Library/Containers/com.microsoft.teams2.respawn/Data/Library/Caches
      - $HOME/Library/Group Containers/UBF8T346G9.com.microsoft.teams/Library/Caches
      - $HOME/Library/Group Containers/UBF8T346G9.com.microsoft.teams/Library/Logs
    delete_mode: contents
    max_depth: 6

  - id: macos-ms-vscode-residual-deep
    name: VS Code / Insiders residual caches and logs
    description: CachedData, Electron caches, extension VSIX cache, Crashpad, ShipIt; never User/ or ~/.vscode extensions state.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/Code/Cache
      - $HOME/Library/Application Support/Code/CachedData
      - $HOME/Library/Application Support/Code/CachedExtensions
      - $HOME/Library/Application Support/Code/CachedExtensionVSIXs
      - $HOME/Library/Application Support/Code/CachedProfilesData
      - $HOME/Library/Application Support/Code/CachedConfigurations
      - $HOME/Library/Application Support/Code/Code Cache
      - $HOME/Library/Application Support/Code/GPUCache
      - $HOME/Library/Application Support/Code/DawnGraphiteCache
      - $HOME/Library/Application Support/Code/DawnWebGPUCache
      - $HOME/Library/Application Support/Code/logs
      - $HOME/Library/Application Support/Code/Crashpad
      - $HOME/Library/Application Support/Code/blob_storage
      - $HOME/Library/Application Support/Code - Insiders/Cache
      - $HOME/Library/Application Support/Code - Insiders/CachedData
      - $HOME/Library/Application Support/Code - Insiders/CachedExtensionVSIXs
      - $HOME/Library/Application Support/Code - Insiders/CachedProfilesData
      - $HOME/Library/Application Support/Code - Insiders/Code Cache
      - $HOME/Library/Application Support/Code - Insiders/GPUCache
      - $HOME/Library/Application Support/Code - Insiders/DawnGraphiteCache
      - $HOME/Library/Application Support/Code - Insiders/logs
      - $HOME/Library/Application Support/Code - Insiders/Crashpad
      - $HOME/Library/Application Support/Code - Insiders/blob_storage
    delete_mode: contents
    max_depth: 5

  - id: macos-ms-windows-app-rdc-deep
    name: Windows App / Remote Desktop residual caches and logs
    description: Microsoft Remote Desktop rebranded Windows App; container caches, group container, legacy beta support paths.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.microsoft.rdc.macos/Data/Library/Logs
      - $HOME/Library/Containers/com.microsoft.Windows-App/Data/Library/Logs
      - $HOME/Library/Caches/com.microsoft.rdc.osx.beta
      - $HOME/Library/Caches/com.microsoft.Windows-App
      - $HOME/Library/Logs/Microsoft Remote Desktop
      - $HOME/Library/Logs/Windows App
      - $HOME/Library/HTTPStorages/com.microsoft.rdc.macos
      - $HOME/Library/HTTPStorages/com.microsoft.Windows-App
      - $HOME/Library/Group Containers/UBF8T346G9.com.microsoft.rdc
    delete_mode: contents
    max_depth: 5
