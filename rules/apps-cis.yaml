pack: apps-cis
rules:

  - id: cis-1c-cache
    name: "1C:Enterprise client caches and temp"
    description: 1C client cache/temp leaves under ~/.1cv8 and Library. Not configuration or infobase data directories.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.1c.enterprise
      - $HOME/Library/Caches/com._1c.enterprise
      - $HOME/Library/Caches/1cv8
      - $HOME/Library/Logs/1C
      - $HOME/Library/Logs/1cv8
    exclude_globs:
      - "**/1cv8.pfl"
      - "**/conf/**"
      - "**/cfg/**"
      - "**/ib/**"
      - "**/database/**"
      - "**/*.1CD"
      - "**/*.cfl"
      - "**/appsrvrs/**"
    delete_mode: contents
    max_depth: 8

  - id: cis-1c-template-cache-report
    name: 1C template and version residual report-only
    description: Broader 1C Application Support residual under common names. Report-only to avoid config wipe.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 30
    paths:
      - $HOME/Library/Application Support/1C
      - $HOME/Library/Application Support/1cv8
      - $HOME/.1cv8
    include_globs:
      - "**/cache/**"
      - "**/Cache/**"
      - "**/tmp/**"
      - "**/temp/**"
      - "**/logs/**"
    exclude_globs:
      - "**/*.1CD"
      - "**/conf/**"
      - "**/ib/**"
    delete_mode: contents
    max_depth: 6

  - id: cis-alfa-invest-residual
    name: Alfa Invest residual caches
    description: Alfa-Investments / Alfa Invest desktop residual caches and logs.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/AlfaInvest/Cache
      - $HOME/Library/Application Support/AlfaInvest/Code Cache
      - $HOME/Library/Application Support/AlfaInvest/GPUCache
      - $HOME/Library/Application Support/AlfaInvest/logs
      - $HOME/Library/Application Support/Alfa Invest/Cache
      - $HOME/Library/Application Support/Alfa Invest/logs
      - $HOME/Library/Application Support/Alfa-Investments/Cache
      - $HOME/Library/Application Support/Alfa-Investments/Code Cache
      - $HOME/Library/Application Support/Alfa-Investments/GPUCache
      - $HOME/Library/Application Support/Alfa-Investments/logs
      - $HOME/Library/Application Support/Альфа-Инвестиции/Cache
      - $HOME/Library/Application Support/Альфа-Инвестиции/logs
      - $HOME/Library/Caches/ru.alfabank.invest
      - $HOME/Library/Caches/ru.alfabank.investments
      - $HOME/Library/Caches/com.alfabank.invest
      - $HOME/Library/Logs/AlfaInvest
      - $HOME/Library/Logs/Alfa Invest
      - $HOME/Library/Logs/Alfa-Investments
    exclude_globs:
      - "**/Cookies*"
      - "**/Local Storage/**"
      - "**/IndexedDB/**"
      - "**/Preferences"
      - "**/Local State"
      - "**/Secrets/**"
      - "**/tokens/**"
      - "**/Keys/**"
    delete_mode: contents
    max_depth: 5

  - id: cis-amocrm-kommo-cache
    name: AmoCRM / Kommo desktop residual caches
    description: AmoCRM and rebranded Kommo desktop Electron residual caches if installed. Primarily web CRM; residual roots only.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Application Support/amoCRM/Cache
      - $HOME/Library/Application Support/amoCRM/Code Cache
      - $HOME/Library/Application Support/amoCRM/GPUCache
      - $HOME/Library/Application Support/amoCRM/logs
      - $HOME/Library/Application Support/AmoCRM/Cache
      - $HOME/Library/Application Support/AmoCRM/logs
      - $HOME/Library/Application Support/Kommo/Cache
      - $HOME/Library/Application Support/Kommo/Code Cache
      - $HOME/Library/Application Support/Kommo/GPUCache
      - $HOME/Library/Application Support/Kommo/logs
      - $HOME/Library/Caches/com.amocrm.desktop
      - $HOME/Library/Caches/com.kommo.desktop
      - $HOME/Library/Caches/ru.amocrm.desktop
      - $HOME/Library/Logs/amoCRM
      - $HOME/Library/Logs/AmoCRM
      - $HOME/Library/Logs/Kommo
    exclude_globs:
      - "**/Cookies*"
      - "**/Local Storage/**"
      - "**/IndexedDB/**"
      - "**/Preferences"
    delete_mode: contents
    max_depth: 5

  - id: cis-bitrix24-cache
    name: Bitrix24 desktop caches and logs
    description: Bitrix24 desktop (com.bitrixsoft.bitrix24desktop) container caches, group container caches, and regenerable .bxd cache leaves. Not full workspace data.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Containers/com.bitrixsoft.bitrix24desktop/Data/Library/Caches
      - $HOME/Library/Containers/com.bitrixsoft.bitrix24desktop/Data/Library/Logs
      - $HOME/Library/Group Containers/com.bitrixsoft.bitrix24desktop/Library/Caches
      - $HOME/Library/Group Containers/com.bitrixsoft.bitrix24desktop/Library/Logs
      - $HOME/Library/Caches/com.bitrixsoft.bitrix24desktop
      - $HOME/Library/Logs/Bitrix24
      - $HOME/Library/HTTPStorages/com.bitrixsoft.bitrix24desktop
      - $HOME/.bxd/cache
      - $HOME/.bxd/Cache
      - $HOME/.bxd/logs
      - $HOME/.bxd/Logs
      - $HOME/.bxd/tmp
    exclude_globs:
      - "**/database/**"
      - "**/Databases/**"
      - "**/Local Storage/**"
      - "**/IndexedDB/**"
      - "**/Cookies*"
    delete_mode: contents
    max_depth: 6

  - id: cis-cryptopro-residual-logs
    name: CryptoPro residual logs and tmp only (careful)
    description: CryptoPro CSP residual log and tmp scratch only. NEVER key containers, user stores, or config. High caution; default off.
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - $HOME/Library/Logs/CryptoPro
      - $HOME/Library/Logs/Crypto-Pro
      - $HOME/Library/Logs/cprocsp
      - $HOME/Library/Caches/ru.cryptopro
      - $HOME/Library/Caches/com.cryptopro.csp
    include_globs:
      - "**/*.log"
      - "**/*.LOG"
      - "**/logs/**"
      - "**/tmp/**"
    exclude_globs:
      - "**/keys/**"
      - "**/users/**"
      - "**/stores/**"
      - "**/certs/**"
      - "**/certificates/**"
      - "**/*.key"
      - "**/*.cer"
      - "**/*.crt"
      - "**/*.pfx"
      - "**/*.p12"
      - "**/license*"
    delete_mode: contents
    max_depth: 4

  - id: cis-cryptopro-var-tmp-report
    name: CryptoPro /var/opt/cprocsp/tmp report-only
    description: "CryptoPro shared tmp scratch under /var/opt/cprocsp/tmp. Report-only: may hold transient session files adjacent to key infrastructure."
    category: logs
    platform: macos
    risk: report-only
    default_enabled: false
    report_only: true
    min_age_days: 30
    paths:
      - /var/opt/cprocsp/tmp
    include_globs:
      - "**/*.log"
      - "**/*.tmp"
      - "**/*.pid"
    exclude_globs:
      - "**/keys/**"
      - "**/users/**"
      - "**/stores/**"
      - "**/*key*"
      - "**/*cert*"
    delete_mode: contents
    max_depth: 3

  - id: cis-goskey-residual-careful
    name: Goskey residual caches (careful, report-biased)
    description: Goskey (Госключ) desktop residual caches/logs if any helper is installed. Default off; never private key material.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 30
    paths:
      - $HOME/Library/Caches/ru.gosuslugi.goskey
      - $HOME/Library/Caches/ru.gosuslugi.goskluch
      - $HOME/Library/Caches/com.gosuslugi.goskey
      - $HOME/Library/Logs/Goskey
      - $HOME/Library/Logs/Госключ
      - $HOME/Library/Application Support/Goskey/Cache
      - $HOME/Library/Application Support/Goskey/logs
      - $HOME/Library/Application Support/Госключ/Cache
      - $HOME/Library/Application Support/Госключ/logs
    include_globs:
      - "**/Cache/**"
      - "**/Caches/**"
      - "**/logs/**"
      - "**/Logs/**"
      - "**/*.log"
    exclude_globs:
      - "**/keys/**"
      - "**/key/**"
      - "**/private/**"
      - "**/Tokens/**"
      - "**/Secure/**"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/*.cer"
    delete_mode: contents
    max_depth: 4

  - id: cis-kontur-ktalk-cache
    name: Kontur Talk / ktalk Electron caches and logs
    description: Kontur Talk (ktalk) Chromium caches, Crashpad, Webrtc stats, sentry breadcrumbs residual, and dated log files. Live-verified; used as Yandex Telemost successor and Contour/Kontur collab client.
