pack: apps-education
rules:

  - id: edu-anki-app-caches
    name: Anki app and launcher caches
    description: Anki Qt/desktop Caches bundles and ShipIt-style leftovers; not decks.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 7
    paths:
      - $HOME/Library/Caches/net.ankiweb.dtop
      - $HOME/Library/Caches/net.ankiweb.launcher
      - $HOME/Library/Caches/net.ankiweb.Anki
      - $HOME/Library/Caches/Anki
      - $HOME/Library/Logs/Anki
    delete_mode: contents
    max_depth: 5

  - id: edu-anki-mpv-webengine-cache
    name: Anki media helper residual caches
    description: Qt WebEngine and helper caches sometimes nested under Anki support trees (not media files).
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/Anki2/QtWebEngine
      - $HOME/Library/Application Support/Anki2/GPUCache
      - $HOME/Library/Application Support/Anki2/Cache
      - $HOME/Library/Application Support/Anki2/Code Cache
    exclude_globs:
      - "**/collection.anki2"
      - "**/collection.media/**"
      - "**/backups/**"
      - "**/*.anki2"
      - "**/*.colpkg"
      - "**/*.apkg"
    delete_mode: contents
    max_depth: 6

  - id: edu-anki-programfiles-cache
    name: AnkiProgramFiles package/download cache
    description: Launcher uv/package download cache under AnkiProgramFiles; reinstallable.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Application Support/AnkiProgramFiles/cache
      - $HOME/Library/Application Support/AnkiProgramFiles/.cache
    delete_mode: contents
    max_depth: 6

  - id: edu-apple-books-residual-caches
    name: Apple Books residual caches
    description: iBooksX / Books app Caches and logs residual; not book files.
    category: app-cache
    platform: macos
    risk: report-only
    default_enabled: false
    min_age_days: 14
    paths:
      - $HOME/Library/Caches/com.apple.Books
      - $HOME/Library/Containers/com.apple.Books/Data/Library/Caches
      - $HOME/Library/Containers/com.apple.iBooksX/Data/tmp
      - $HOME/Library/Logs/Books
      - $HOME/Library/Logs/iBooksX
