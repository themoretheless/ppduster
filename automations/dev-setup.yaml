pack: dev-setup
description: Bootstrap a macOS development machine with common CLI tools and dotfiles.
platform: macos
steps:
  # ── Package manager ───────────────────────────────────────────────────────
  - type: run-command
    command: /bin/bash
    args:
      - -c
      - >-
        curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh | bash
    ignore_failure: true

  # ── Core CLI tools ────────────────────────────────────────────────────────
  - type: brew-install
    package: git

  - type: brew-install
    package: gh

  - type: brew-install
    package: ripgrep

  - type: brew-install
    package: fd

  - type: brew-install
    package: bat

  - type: brew-install
    package: starship

  - type: brew-install
    package: mise

  # ── Dotfiles ──────────────────────────────────────────────────────────────
  - type: git-clone
    url: https://github.com/example/dotfiles.git
    dest: ~/.dotfiles
    depth: 1

  - type: run-command
    command: bash
    args: ["~/.dotfiles/install.sh"]
    ignore_failure: true

  # ── Shell config symlinks ─────────────────────────────────────────────────
  - type: symlink
    src: ~/.dotfiles/zshrc
    dest: ~/.zshrc
    force: true

  - type: symlink
    src: ~/.dotfiles/gitconfig
    dest: ~/.gitconfig
    force: true

  # ── Starship prompt config ────────────────────────────────────────────────
  - type: write-file
    dest: ~/.config/starship.toml
    content: |
      # Generated by ppduster dev-setup automation
      [character]
      success_symbol = "[›](bold green)"
      error_symbol   = "[›](bold red)"
    create_parents: true

  # ── Environment hints ─────────────────────────────────────────────────────
  - type: set-env-hint
    var: EDITOR
    value: vim
    note: Override with your preferred editor

  - type: set-env-hint
    var: HOMEBREW_NO_ANALYTICS
    value: "1"
    note: Opt out of Homebrew analytics
