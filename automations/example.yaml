# Example automation pack — ppduster setup
#
# The `pack:` field is the id used in CLI commands:
#   ppduster setup list
#   ppduster setup show example
#   ppduster setup run example          # dry-run
#   ppduster setup run example --yes    # live (runner core required)
#
# Step kinds use the `type:` discriminant (kebab-case).
# Supported: git-clone, brew-install, brew-cask, run-command,
#            download, extract, install-dmg, install-pkg,
#            symlink, write-file, set-env-hint

pack: example
description: "Demonstrates all supported step kinds. Not meant to be run as-is."
platform: macos

steps:
  # Install a Homebrew formula
  - type: brew-install
    package: git

  # Install a Homebrew formula with a tap
  - type: brew-install
    package: act
    tap: nektos/tap

  # Install a Homebrew cask (GUI app)
  - type: brew-cask
    package: visual-studio-code

  # Clone a repository (shallow)
  - type: git-clone
    url: https://github.com/example/dotfiles.git
    dest: ~/.dotfiles
    depth: 1

  # Run a command (argv list — no shell expansion by default)
  - type: run-command
    argv: [bash, ~/.dotfiles/install.sh]
    ignore_failure: true

  # Download a file (sha256 required for External packs)
  - type: download
    url: https://example.com/tools/mytool-1.0.tar.gz
    dest: /tmp/mytool.tar.gz
    sha256: "abc123def456abc123def456abc123def456abc123def456abc123def456abc1"

  # Extract an archive
  - type: extract
    src: /tmp/mytool.tar.gz
    dest: /tmp/mytool
    strip_components: 1

  # Create a symlink
  - type: symlink
    src: ~/.dotfiles/zshrc
    dest: ~/.zshrc
    force: true

  # Write a config file
  - type: write-file
    dest: ~/.config/starship.toml
    content: |
      [character]
      success_symbol = "[›](bold green)"
    create_parents: true

  # Set an environment variable hint (does not modify env; prints guidance)
  - type: set-env-hint
    var: EDITOR
    value: vim
    note: Override with your preferred editor

  # Install a .dmg (requires --allow-privileged)
  - type: install-dmg
    src: /tmp/SomeApp.dmg
    app_name: SomeApp.app
    dest_dir: /Applications
    require_notarized: true

  # Install a .pkg (requires --allow-privileged)
  - type: install-pkg
    src: /tmp/cli-tools.pkg
    target: /
    require_notarized: true
