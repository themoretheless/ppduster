[package]
name = "ppduster"
default-run = "ppduster"
version = "0.1.0"
edition = "2021"
description = "Safe, rule-driven system junk cleaner (logs, caches, temp, leftovers)"
license = "MIT"
readme = "README.md"
keywords = ["cleaner", "cache", "temp", "disk", "maintenance"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
bytesize = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
tabled = "0.18"
thiserror = "2"
trash = "5"
walkdir = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.9"
bzip2 = "0.6.1"
xz2 = "0.1.7"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }

[dev-dependencies]
tempfile = "3"
