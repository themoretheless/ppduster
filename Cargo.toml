[package]
name = "ppduster"
version = "0.1.0"
edition = "2021"
description = "Safe, rule-driven system junk cleaner (logs, caches, temp, leftovers)"
license = "MIT"
readme = "README.md"
keywords = ["cleaner", "cache", "temp", "disk", "maintenance"]
categories = ["command-line-utilities"]

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1"
bytesize = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
globset = "0.4"
libc = "0.2"
regex = "1"
rpassword = "7.5.4"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
tabled = "0.18"
thiserror = "2"
tempfile = "3"
trash = "5"
walkdir = "2"
zeroize = "1.8"
