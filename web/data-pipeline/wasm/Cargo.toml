[package]
name = "peregon_engine"
version = "1.0.1"
edition = "2021"
description = "Rust/WASM engine for Peregon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
themoretheless-tokenizer = { git = "https://github.com/themoretheless/tokenizer.git", rev = "d1f7c06f5d86f1810bc3214c87ee73374d107b63" }
wasm-bindgen = "0.2.125"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
