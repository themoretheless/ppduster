[package]
name = "ppduster-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for creating validated ppduster scenario diagrams"
license = "MIT"
readme = "README.md"
repository = "https://github.com/themoretheless/ppduster"
keywords = ["mcp", "workflow", "automation", "diagram"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
ppduster = { path = "../.." }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3"
