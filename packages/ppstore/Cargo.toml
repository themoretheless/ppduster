[package]
name = "ppstore"
version = "0.1.0"
edition = "2021"
description = "Standalone Mac App Store search, inventory, install, and update CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/themoretheless/ppduster"
keywords = ["macos", "app-store", "cli", "installer"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.18"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSDate", "NSError", "NSRunLoop", "NSString", "std"] }

[dev-dependencies]
tempfile = "3"
