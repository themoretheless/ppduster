task:
  id: dev-brew-bootstrap
  name: Dev brew bootstrap
  description: Clone or fast-forward the ppduster main branch and install ripgrep when needed; the sync step reports the repository state before and after.
  platform: macos
  trust: bundled-only
  steps:
    - id: clone-repo
      name: Clone or update repository
      type: git-clone
      repo: https://github.com/themoretheless/ppduster.git
      dest: $HOME/Library/Caches/ppduster-bootstrap
      branch: main
    - id: install-ripgrep
      name: Install ripgrep
      type: brew-install
      package: ripgrep
      check:
        command_succeeds: ["brew", "list", "ripgrep"]
