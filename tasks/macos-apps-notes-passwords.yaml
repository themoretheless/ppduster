task:
  id: macos-apps-notes-passwords
  name: Popular notes and passwords
  description: |
    Install Obsidian, Notion, 1Password, and Bitwarden from Homebrew casks.
    Source: Homebrew cask install counts for the last 365 days.
    Does not create vaults, does not sign in, and does not install 1Password CLI.
    Homebrew must already be on PATH. Dry-run is still the default.
  platform: macos
  trust: bundled-only
  steps:
    - id: install-obsidian
      name: Install Obsidian
      type: brew-install
      package: obsidian
      cask: true
      check:
        command_succeeds: ["brew", "list", "--cask", "obsidian"]
    - id: install-notion
      name: Install Notion
      type: brew-install
      package: notion
      cask: true
      check:
        command_succeeds: ["brew", "list", "--cask", "notion"]
    - id: install-1password
      name: Install 1Password
      type: brew-install
      package: 1password
      cask: true
      check:
        command_succeeds: ["brew", "list", "--cask", "1password"]
    - id: install-bitwarden
      name: Install Bitwarden
      type: brew-install
      package: bitwarden
      cask: true
      check:
        command_succeeds: ["brew", "list", "--cask", "bitwarden"]
