task:
  id: macos-top-26-app-store
  name: macOS App Store baseline
  description: Install the mas CLI used by typed app-store-install steps and list installed Mac App Store applications.
  platform: macos
  trust: bundled-only
  steps:
    - id: install-mas
      name: Install mas CLI
      type: brew-install
      package: mas
      check:
        command_succeeds: ["brew", "list", "mas"]
    - id: list-app-store-apps
      name: List installed Mac App Store applications
      type: run-command
      program: mas
      args: ["list"]
