task:
  id: macos-top-26-app-store
  name: macOS App Store baseline
  description: Verify the macOS baseline used by native App Store automation and safely inspect Spotlight metadata for installed App Store applications without installing third-party tooling.
  platform: macos
  trust: bundled-only
  steps:
    - id: verify-app-store-requirements
      name: Verify native App Store macOS requirements
      type: macos-requirements
      minimum_version: "14.0"
    - id: inspect-app-store-metadata
      name: Inspect installed App Store receipt metadata
      type: run-command
      program: /usr/bin/mdfind
      args: ["kMDItemAppStoreHasReceipt == 1"]
