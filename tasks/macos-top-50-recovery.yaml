task:
  id: macos-top-50-recovery
  name: macOS recovery workflow
  description: Plan recovery assets and a post-reinstall restore workflow.
  platform: macos
  trust: bundled-only
  steps:
    - id: ensure-recovery-dir
      name: Ensure recovery assets directory exists
      type: create-directory
      path: $HOME/.local/state/macos-recovery
    - id: plan-restore-manifest
      name: Plan restore manifest export
      type: run-command
      program: bash
      args: ["-lc", "ls \"$HOME/.config/macos\" > \"$HOME/.local/state/macos-recovery/restore-manifest.txt\""]
      dangerous: true
      shell: allow
