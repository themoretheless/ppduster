task:
  id: macos-top-07-git-ssh-gpg
  name: macOS Git SSH GPG baseline
  description: Plan developer identity bootstrap for git, SSH config, and commit signing.
  platform: macos
  trust: bundled-only
  steps:
    - id: verify-git
      name: Verify git is installed
      type: run-command
      program: git
      args: ["--version"]
      check:
        command_succeeds: ["git", "--version"]
    - id: verify-ssh-dir
      name: Verify SSH directory
      type: inspect-path
      path: $HOME/.ssh
      expect:
        exists: true
        kind: directory
    - id: verify-gpg
      name: Verify GPG is installed
      type: run-command
      program: gpg
      args: ["--version"]
