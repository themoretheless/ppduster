task:
  id: macos-top-40-fonts
  name: macOS fonts baseline
  description: Plan developer and productivity font installation.
  platform: macos
  trust: bundled-only
  steps:
    - id: install-font-tap
      name: Install homebrew fonts tap
      type: run-command
      program: brew
      args: ["tap", "homebrew/cask-fonts"]
    - id: install-jetbrains-font
      name: Install JetBrains Mono Nerd Font
      type: brew-install
      package: font-jetbrains-mono-nerd-font
      cask: true
