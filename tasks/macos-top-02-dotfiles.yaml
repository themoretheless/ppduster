task:
  id: macos-top-02-dotfiles
  name: macOS dotfiles sync
  description: Clone or fast-forward the dotfiles main branch, then verify the shell configuration target.
  platform: macos
  trust: bundled-only
  steps:
    - id: clone-dotfiles
      name: Clone or update dotfiles repository
      auth: git-credential
      type: git-clone
      repo: https://github.com/example/dotfiles.git
      dest: $HOME/.local/share/dotfiles
      branch: main
    - id: verify-zsh-config
      name: Verify shell config target
      type: inspect-path
      path: $HOME/.zshrc
      expect:
        exists: true
        kind: file
